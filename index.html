<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prove Calcestruzzo</title>


<style>

body{

font-family:Arial,sans-serif;

background:#5b5b5b;

margin:0;

padding:20px;

color:white;

}



.container{

max-width:520px;

margin:auto;

background:#292929;

padding:25px;

border-radius:15px;

box-shadow:0 0 15px #222;

}



h1{

text-align:center;

color:#f59e0b;

}



label{

font-weight:bold;

}



small{

color:#aaa;

}



input{

width:100%;

padding:12px;

margin:8px 0 15px;

border:0;

border-radius:8px;

font-size:16px;

box-sizing:border-box;

}



.prova{

background:#3f3f3f;

padding:12px;

border-radius:8px;

margin:8px 0;

}



.prova input{

width:auto;

margin-right:10px;

}



button{

width:100%;

padding:14px;

margin-top:15px;

border:0;

border-radius:10px;

background:#d97706;

color:white;

font-size:16px;

}



.reset{

background:#dc2626;

}



.risultato{

background:#111;

margin-top:20px;

padding:15px;

border-radius:10px;

}



.link{

display:block;

background:#2563eb;

color:white;

padding:12px;

border-radius:8px;

margin-top:10px;

text-align:center;

text-decoration:none;

}



.fatto{

background:#16a34a !important;

}



.dataGrande{

font-size:32px;

font-weight:bold;

color:#f59e0b;

margin:10px 0;

}



</style>


</head>



<body>


<div class="container">



<h1>

Prove Calcestruzzo

</h1>



<label>

Impianto

</label>


<input

id="impianto"

placeholder="Nome impianto">





<label>

Data prelievo

</label>


<input

type="date"

id="data">





<label>

Numero miscele <small>*</small>

</label>


<input

type="number"

id="miscele"

min="1"

value="1"

placeholder="Numero miscele">





<label>

Numero verbale <small>*</small>

</label>


<input

id="verbale"

placeholder="Numero verbale">





<h3>

Giorni rottura

</h3>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="1">

Rottura a 1 giorno

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="3">

Rottura a 3 giorni

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="4">

Rottura a 4 giorni

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="7"

checked>

Rottura a 7 giorni

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="14">

Rottura a 14 giorni

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="28"

checked>

Rottura a 28 giorni

</div>



<div class="prova">

<input

type="checkbox"

class="giorno"

value="60"

checked>

Rottura a 60 giorni

</div>



<button onclick="genera()">

Genera calendario

</button>



<button class="reset" onclick="resetStato()">

Reset importazioni

</button>



<div id="risultato" class="risultato">

Nessun evento creato

</div>



<script>



document.getElementById("data").valueAsDate=new Date();



function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(

nuova.getDate()+giorni

);


return nuova;


}



function formatoData(data){


return data.toLocaleDateString("it-IT");


}



function getGiorni(){


let lista=[];


document.querySelectorAll(".giorno:checked")

.forEach(function(x){


lista.push(Number(x.value));


});


return lista;


}



function formatoGoogle(data,ora){


let anno=data.getFullYear();


let mese=String(data.getMonth()+1).padStart(2,"0");


let giorno=String(data.getDate()).padStart(2,"0");


return anno+mese+giorno+"T"+ora;


}
    
function creaLinkGoogle(titolo,inizio,fine,descrizione){


return(

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="

+

encodeURIComponent(titolo)

+

"&dates="

+

inizio

+

"%2F"

+

fine

+

"&details="

+

encodeURIComponent(descrizione)

);


}




function importato(id){


return localStorage.getItem(id)==="si";


}





function segnaImportato(id,bottone){


localStorage.setItem(id,"si");


bottone.innerHTML="✓ Inserito";


bottone.classList.add("fatto");


}





function creaBottone(link,id){


let classe=

importato(id)

?

"link fatto"

:

"link";



let testo=

importato(id)

?

"✓ Inserito"

:

"Apri calendario Google";



return `


<a

class="${classe}"

href="${link}"

target="_blank"

onclick="segnaImportato('${id}',this)">


${testo}


</a>


`;


}







function genera(){



let impianto=

document.getElementById("impianto")

.value.trim();




let valoreData=

document.getElementById("data")

.value;



let miscele=

Number(

document.getElementById("miscele")

.value

);




let verbale=

document.getElementById("verbale")

.value.trim();





if(!impianto || !valoreData){


alert("Inserire impianto e data prelievo");


return;


}





if(!miscele || miscele<1){


miscele=1;


}




let cubi=

miscele*2;





let parti=

valoreData.split("-");



let dataPrelievo=

new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);





let giorni=

getGiorni();





if(giorni.length===0){


alert("Selezionare almeno una rottura");


return;


}





let html="";





html+=`

<b style="font-size:22px;color:#f59e0b">

PRELIEVO

</b>


<div class="dataGrande">

${formatoData(dataPrelievo)}

</div>


Impianto:

<b>${impianto}</b>

<br>


Miscele:

<b>${miscele}</b>


<br>


Cubi per ogni rottura:

<b>${cubi}</b>


`;



if(verbale!=""){


html+=`

<br>

Verbale:

<b>${verbale}</b>

`;

}



giorni.forEach(function(giorno){



let dataRottura=

aggiungiGiorni(

dataPrelievo,

giorno

);





let dataTesto=

formatoData(dataRottura);



let titolo=

"Rottura "

+

giorno

+

" giorni - "

+

impianto;





let descrizione=

"PROVA DI COMPRESSIONE\n\n"

+

"Impianto: "

+

impianto

+

"\n";




if(verbale!=""){


descrizione+=

"Verbale: "

+

verbale

+

"\n";


}




descrizione+=

"Miscele: "

+

miscele

+

"\n"

+

"Cubi da rompere: "

+

cubi

+

"\n\n"

+

"Data prelievo: "

+

formatoData(dataPrelievo)

+

"\n"

+

"Data rottura: "

+

dataTesto

+

"\n"

+

"Età provino: "

+

giorno

+

" giorni";



let link=

creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);



let id=

"rottura_"

+

impianto

+

"_"

+

valoreData

+

"_"

+

giorno;

               
html+=`

<hr>


<b style="font-size:22px">

Rottura a ${giorno} giorni

</b>


<div class="dataGrande">

${dataTesto}

</div>


Miscele:

<b>${miscele}</b>


<br>


Cubi da rompere:

<b>${cubi}</b>


`;



html+=creaBottone(

link,

id

);



});



document.getElementById("risultato").innerHTML=html;



}




function resetStato(){



if(confirm("Cancellare stato importazioni?")){



localStorage.clear();



alert("Stato cancellato");



genera();



}


}

<button onclick="nuovoPrelievo()">

Nuovo prelievo

</button>


</script>


</div>


</body>


</html>
