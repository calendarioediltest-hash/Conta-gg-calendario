<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestione Prove Calcestruzzo</title>


<style>

body{
font-family:Arial,sans-serif;
background:#5b5b5b;
padding:20px;
margin:0;
color:white;
}


.container{
max-width:520px;
margin:auto;
background:#292929;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px #222;
}


h1{
text-align:center;
color:#f59e0b;
}


input{
width:100%;
padding:12px;
margin:8px 0 15px;
border-radius:8px;
border:0;
box-sizing:border-box;
font-size:16px;
}


.prova{
background:#3f3f3f;
padding:10px;
border-radius:8px;
margin:8px 0;
}


button{
width:100%;
padding:13px;
margin-top:15px;
border:0;
border-radius:10px;
background:#d97706;
color:white;
font-size:16px;
}


.risultato{
margin-top:20px;
background:#111;
padding:15px;
border-radius:10px;
}


.link{
display:block;
background:#2563eb;
color:white;
padding:12px;
margin-top:10px;
border-radius:8px;
text-align:center;
text-decoration:none;
}


.fatto{
background:#16a34a !important;
}


.reset{
background:#dc2626;
}


</style>


</head>


<body>


<div class="container">


<h1>Gestione Prove Calcestruzzo</h1>


<label>Nome impianto</label>

<input id="impianto" placeholder="Nome impianto">


<label>Data prelievo</label>

<input type="date" id="data">



<h3>Seleziona rotture</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
1 giorno
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="3">
3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="4">
4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="14">
14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
60 giorni
</div>


<button onclick="genera()">
Genera calendario
</button>


<button class="reset" onclick="resetStato()">
Reset stato importazioni
</button>


<div id="risultato" class="risultato">
Nessun evento creato
</div>

<script>


// data di oggi automatica

document.getElementById("data").valueAsDate = new Date();



// aggiunge giorni

function aggiungiGiorni(data, giorni){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + giorni);

    return nuova;

}



// formato italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}



// legge prove selezionate

function getProve(){

    let lista=[];


    document.querySelectorAll(".giorno:checked").forEach(function(x){

        lista.push(Number(x.value));

    });


    return lista;

}



// formato Google Calendar

function formatoGoogle(data, ora){

    let anno = data.getFullYear();

    let mese = String(data.getMonth()+1).padStart(2,"0");

    let giorno = String(data.getDate()).padStart(2,"0");


    return anno + mese + giorno + "T" + ora;

}




// crea link Google Calendar

function creaLinkGoogle(titolo, inizio, fine, descrizione){


    return (

    "https://calendar.google.com/calendar/render"

    +

    "?action=TEMPLATE"

    +

    "&text="

    +

    encodeURIComponent(titolo)

    +

    "&dates="

    +

    inizio

    +

    "%2F"

    +

    fine

    +

    "&details="

    +

    encodeURIComponent(descrizione)

    );

}




// controlla se già importato

function eventoImportato(id){

    return localStorage.getItem(id)==="si";

}




// segna come importato

function segnaImportato(id, bottone){

    localStorage.setItem(id,"si");

    bottone.innerHTML="✓ Inserito nel calendario";

    bottone.classList.add("fatto");

}




// crea pulsante

function creaBottone(link,id,testo){


    let giaFatto = eventoImportato(id);



    let classe = giaFatto ? "link fatto" : "link";



    let scritta = giaFatto ?

    "✓ Inserito nel calendario"

    :

    testo;



    return `

    <a 

    class="${classe}"

    target="_blank"

    href="${link}"

    onclick="segnaImportato('${id}',this)">

    ${scritta}

    </a>

    `;

}


function genera(){



let impianto =
document.getElementById("impianto").value;



let valoreData =
document.getElementById("data").value;



if(!impianto || !valoreData){

alert("Inserire impianto e data prelievo");

return;

}



let dataPrelievo =
new Date(valoreData);



let prove =
getProve();



if(prove.length===0){

alert("Selezionare almeno una rottura");

return;

}



let html="";



let dataTesto =
formatoData(dataPrelievo);




// REPORT

let titoloReport =

"REPORT calcestruzzo - " + impianto;



let descrizioneReport =

"Report calcestruzzo\n\n"

+

"Impianto: "

+

impianto

+

"\nData prelievo: "

+

dataTesto;



let linkReport = creaLinkGoogle(

titoloReport,

formatoGoogle(dataPrelievo,"080000"),

formatoGoogle(dataPrelievo,"170000"),

descrizioneReport

);



let idReport =

"report_" +

impianto +

"_" +

valoreData;



html +=

"<b>REPORT CALCESTRUZZO</b><br>"

+

dataTesto;



html += creaBottone(

linkReport,

idReport,

"Importa nel Calendario Google"

);






// ROTTURE


prove.forEach(function(giorni){



let dataRottura =

aggiungiGiorni(

dataPrelievo,

giorni

);



let dataRotturaTesto =

formatoData(dataRottura);



let titolo =

"Rottura cubetti "

+

giorni

+

" giorni - Prelievo "

+

dataTesto

+

" - "

+

impianto;





let descrizione =

"Prova compressione cubetti\n\n"

+

"Impianto: "

+

impianto

+

"\nData prelievo: "

+

dataTesto

+

"\nData rottura: "

+

dataRotturaTesto

+

"\nEtà provino: "

+

giorni

+

" giorni";





let link = creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);





let id =

"rottura_"

+

impianto

+

"_"

+

valoreData

+

"_"

+

giorni;





html +=

"<br><br><b>Rottura "

+

giorni

+

" giorni</b><br>"

+

dataRotturaTesto;



html += creaBottone(

link,

id,

"Importa nel Calendario Google"

);



});





document.getElementById("risultato").innerHTML = html;



}




function resetStato(){


if(confirm("Cancellare lo stato delle importazioni?")){


localStorage.clear();


alert("Stato azzerato");


genera();


}


}

</script>


</div>


</body>

</html>
