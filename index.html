<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotture Cubetti</title>

<style>

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.box{
max-width:500px;
margin:auto;
background:#1e293b;
padding:20px;
border-radius:15px;
}

h1{
text-align:center;
}

input{
width:100%;
padding:12px;
margin:8px 0 15px;
border-radius:8px;
border:0;
box-sizing:border-box;
}

.prova{
background:#334155;
padding:10px;
border-radius:8px;
margin:8px 0;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:0;
border-radius:10px;
font-size:17px;
background:#16a34a;
color:white;
}

.blue{
background:#2563eb;
}

.risultato{
background:#334155;
padding:15px;
border-radius:10px;
margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

<h1>🧱 Rotture a compressione cubetti</h1>


<label>Campione / Cantiere</label>

<input id="campione" placeholder="es. Cantiere Rossi">


<label>Data confezionamento</label>

<input type="date" id="data">


<h3>Prove:</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
+1 giorno
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="3">
+3 giorni
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="4">
+4 giorni
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
+7 giorni
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="14">
+14 giorni
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
+28 giorni
</div>

<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
+60 giorni
</div>


<button onclick="calcola()">
🧮 Calcola date
</button>


<div id="risultato" class="risultato">
Nessun risultato
</div>


<button class="blue" onclick="creaEventi()">
📅 Crea eventi Google Calendar
</button>
<script>


// data di oggi automatica

document.getElementById("data").valueAsDate = new Date();



let riepilogo = "";




// aggiunge giorni alla data

function aggiungiGiorni(data, numero){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + numero);

    return nuova;

}




// formato italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}




// legge prove selezionate

function getProve(){

    let lista=[];


    document.querySelectorAll(".giorno:checked").forEach((elemento)=>{

        lista.push(Number(elemento.value));

    });


    return lista;

}






function calcola(){


    let valore = document.getElementById("data").value;


    if(!valore){

        alert("Inserisci una data");

        return;

    }



    let data = new Date(valore);


    let campione =
    document.getElementById("campione").value;



    let prove = getProve();



    if(prove.length===0){

        alert("Seleziona almeno una prova");

        return;

    }



    riepilogo =
    "🧱 Rotture a compressione cubetti\n\n";



    if(campione){

        riepilogo +=
        "Campione: " + campione + "\n\n";

    }



    prove.forEach((giorni)=>{


        let dataProva =
        aggiungiGiorni(data,giorni);



        riepilogo +=
        "📅 " + giorni + " giorni → "
        + formatoData(dataProva)
        + "\n";


    });



    document.getElementById("risultato").innerHTML =
    riepilogo.replace(/\n/g,"<br>");

}






// crea eventi Google Calendar

function creaEventi(){


    let valore =
    document.getElementById("data").value;


    if(!valore){

        alert("Inserisci una data");

        return;

    }



    let data = new Date(valore);



    let campione =
    document.getElementById("campione").value;



    let prove = getProve();



    if(prove.length===0){

        alert("Seleziona almeno una prova");

        return;

    }




    prove.forEach((giorni,indice)=>{


        setTimeout(()=>{


            let dataEvento =
            aggiungiGiorni(data,giorni);



            let anno =
            dataEvento.getFullYear();



            let mese =
            String(dataEvento.getMonth()+1).padStart(2,"0");



            let giorno =
            String(dataEvento.getDate()).padStart(2,"0");



            let inizio =
            anno + mese + giorno + "T090000";



            let fine =
            anno + mese + giorno + "T100000";



            let titolo =
            "🧱 Rottura cubetti - "
            + giorni
            + " giorni";



            if(campione){

                titolo +=
                " - "
                + campione;

            }



            let url =
            "https://calendar.google.com/calendar/render?action=TEMPLATE"
            + "&text="
            + encodeURIComponent(titolo)
            + "&dates="
            + inizio
            + "%2F"
            + fine;



            window.open(url,"_blank");



        }, indice * 3000);



    });


}
</script>


</div>


</body>

</html>
