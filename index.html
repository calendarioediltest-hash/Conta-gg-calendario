<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotture a compressione cubetti</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:18px;
}

h1{
    text-align:center;
    font-size:24px;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    border-radius:10px;
    border:none;
    font-size:16px;
    box-sizing:border-box;
}

.prova{
    background:#334155;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    font-size:17px;
    color:white;
    background:#16a34a;
}

button.blue{
    background:#2563eb;
}

.risultato{
    background:#334155;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    line-height:1.8;
}

</style>

</head>


<body>


<div class="container">


<h1>🧱 Rotture a compressione cubetti</h1>


<label>Campione / Cantiere</label>

<input id="campione" placeholder="es. Cantiere Rossi - Campione 1">


<label>Data confezionamento</label>

<input type="date" id="data">


<h3>Seleziona prove:</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
+1 giorno (24 ore)
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="3">
+3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="4">
+4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
+7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="14">
+14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
+28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
+60 giorni
</div>


<button onclick="calcola()">
🧮 Calcola date
</button>


<div id="risultato" class="risultato">
Nessun calcolo eseguito
</div>


<button class="blue" onclick="googleCalendar()">
📅 Apri Google Calendar
</button>


<button onclick="condividi()">
📤 Condividi
</button>
<script>


// testo da condividere

let testo = "";


// data di oggi automatica

document.getElementById("data").valueAsDate = new Date();




// aggiunge giorni

function aggiungiGiorni(data, giorni){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + giorni);

    return nuova;

}




// formato italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}




// legge le caselle selezionate

function selezionati(){

    let lista=[];


    document.querySelectorAll(".giorno:checked").forEach(c=>{

        lista.push(Number(c.value));

    });


    return lista;

}





function calcola(){


    let valore = document.getElementById("data").value;


    if(!valore){

        alert("Inserisci una data");

        return;

    }


    let data = new Date(valore);


    let campione =
    document.getElementById("campione").value;



    let prove = selezionati();



    if(prove.length===0){

        alert("Seleziona almeno una prova");

        return;

    }



    testo =
`🧱 Rotture a compressione cubetti

${campione ? "Campione: "+campione+"\n\n" : ""}📅 Data confezionamento:
${formatoData(data)}

`;



    prove.forEach(g=>{


        let d = aggiungiGiorni(data,g);


        testo +=
        "➕ " + g + " giorni → " + formatoData(d) + "\n";


    });



    document.getElementById("risultato").innerHTML =
    testo.replace(/\n/g,"<br>");

}






// apre Google Calendar con un solo evento

function googleCalendar(){


    let valore = document.getElementById("data").value;


    if(!valore){

        alert("Inserisci una data");

        return;

    }



    let data = new Date(valore);


    let campione =
    document.getElementById("campione").value;



    let prove = selezionati();



    if(prove.length===0){

        alert("Seleziona almeno una prova");

        return;

    }




    let dettagli =
    "🧱 Rotture a compressione cubetti\n\n";



    if(campione){

        dettagli +=
        "Campione: " + campione + "\n\n";

    }



    dettagli += "Date prove:\n\n";



    prove.forEach(g=>{


        let evento =
        aggiungiGiorni(data,g);


        dettagli +=
        "➕ " + g + " giorni: "
        + formatoData(evento)
        + "\n";


    });



    let oggi = new Date();


    let y = oggi.getFullYear();

    let m = String(oggi.getMonth()+1).padStart(2,"0");

    let d = String(oggi.getDate()).padStart(2,"0");



    let url =

    "https://calendar.google.com/calendar/render?action=TEMPLATE"

    + "&text="

    + encodeURIComponent(
        "🧱 Rotture cubetti "
        + (campione ? "- "+campione : "")
    )


    + "&dates="

    + y+m+d+"T090000/"+y+m+d+"T093000"


    + "&details="

    + encodeURIComponent(dettagli);



    window.open(url,"_blank");


}
function condividi(){


    if(!testo){

        alert("Prima calcola le date");

        return;

    }



    if(navigator.share){


        navigator.share({

            title:"Rotture a compressione cubetti",

            text:testo

        });


    }else{


        navigator.clipboard.writeText(testo);

        alert("Risultato copiato negli appunti");

    }


}



</script>


</div>


</body>

</html>
