<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDILTEST 2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#cbd5e1,#f8fafc);
color:#16324f;
}


.container{
max-width:540px;
margin:auto;
}


.app{
background:rgba(255,255,255,0.75);
backdrop-filter:blur(18px);
border-radius:30px;
padding:22px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);
}


.titolo{
font-family:'Montserrat',sans-serif;
text-align:center;
font-size:28px;
font-weight:700;
color:#0b416b;
}


.sottotitolo{
text-align:center;
font-size:12px;
color:#64748b;
margin-bottom:20px;
}


.sezione{
font-family:'Montserrat',sans-serif;
font-size:17px;
font-weight:700;
color:#0b416b;
margin-top:20px;
}


label{
display:block;
margin-top:12px;
font-size:14px;
font-weight:600;
}


.info{
font-size:11px;
color:#64748b;
font-weight:400;
}


input{
width:100%;
height:50px;
border:0;
border-radius:15px;
padding:10px;
margin-top:5px;
font-size:16px;
background:white;
}


input:focus{
outline:none;
box-shadow:0 0 0 3px rgba(11,65,107,0.20);
}


button{
cursor:pointer;
transition:.2s;
}


button:hover{
transform:scale(1.03);
}


button:active{
transform:scale(.97);
}


.bottone{
width:100%;
height:55px;
border:0;
border-radius:16px;
margin-top:12px;
font-size:15px;
font-weight:700;
color:white;
}


.gps{
background:#16a34a;
}


.genera{
height:65px;
background:#0b416b;
font-size:17px;
}


.contatore{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
}


.contatore button{
width:55px;
height:50px;
border:0;
border-radius:15px;
background:#0b416b;
color:white;
font-size:28px;
}


.contatore input{
width:80px;
text-align:center;
font-size:22px;
font-weight:bold;
}


.giorni{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:15px;
}


.giorno{
height:50px;
border:0;
border-radius:15px;
background:white;
color:#0b416b;
font-size:16px;
font-weight:700;
}


.giorno.attivo{
background:#0b416b;
color:white;
}


.evento{
background:white;
border-radius:18px;
padding:15px;
margin-top:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}


.eventoRitiro{
background:#dcfce7;
border-left:8px solid #16a34a;
}


.titoloEvento{
font-size:16px;
font-weight:700;
color:#0b416b;
margin-bottom:8px;
}


.eventoRitiro .titoloEvento,
.eventoRitiro .evidenza{
color:#15803d;
}


.datoEvento{
font-size:14px;
margin-top:6px;
}


.evidenza{
font-size:20px;
font-weight:800;
color:#0b416b;
margin:8px 0;
}


.bottoneGoogle{
display:block;
margin-top:12px;
padding:15px;
background:#2563eb;
border-radius:15px;
color:white;
text-align:center;
text-decoration:none;
font-weight:700;
}


.bottoneWhatsApp{
display:block;
margin-top:12px;
padding:15px;
background:#16a34a;
border-radius:15px;
color:white;
text-align:center;
text-decoration:none;
font-weight:700;
}


.bottoneInserito{
background:#16a34a !important;
box-shadow:0 0 15px rgba(22,163,74,.8);
}


</style>
</head>


<body>


<div class="container">

<div class="app">


<div class="titolo">
EDILTEST 2.0
</div>


<div class="sottotitolo">
Gestione prove calcestruzzo<br>
Prelievi • Rotture • Calendario • Comunicazioni
</div>


<div class="sezione">
DATI PRELIEVO
</div>


<label>
Impianto
<span class="info">(obbligatorio)</span>
</label>

<input id="impianto" placeholder="Nome impianto">


<label>
Cantiere
<span class="info">(opzionale)</span>
</label>

<input id="cantiere" placeholder="Nome cantiere">


<label>
Posizione cantiere
<span class="info">(indirizzo o link Maps)</span>
</label>

<input id="posizione" placeholder="Indirizzo cantiere o link Maps">

<button class="bottone gps" onclick="acquisisciPosizione()">

RILEVA POSIZIONE CANTIERE

</button>


<label>
Data prelievo
</label>

<input type="date" id="data">


<label>
Numero miscele
</label>


<div class="contatore">

<button onclick="modificaMiscele(-1)">
−
</button>


<input id="miscele" value="1" readonly>


<button onclick="modificaMiscele(1)">
+
</button>

</div>


<label>
Numero verbale
</label>

<input id="verbale" placeholder="Numero verbale">


<div class="sezione">
PROGRAMMA ROTTURE
</div>


<div class="info">
Seleziona giorni maturazione
</div>


<div class="giorni">


<button class="giorno" onclick="selezionaGiorno(this,1)">1</button>

<button class="giorno" onclick="selezionaGiorno(this,2)">2</button>

<button class="giorno" onclick="selezionaGiorno(this,3)">3</button>

<button class="giorno" onclick="selezionaGiorno(this,4)">4</button>

<button class="giorno attivo" onclick="selezionaGiorno(this,7)">7</button>

<button class="giorno" onclick="selezionaGiorno(this,14)">14</button>

<button class="giorno attivo" onclick="selezionaGiorno(this,28)">28</button>

<button class="giorno attivo" onclick="selezionaGiorno(this,60)">60</button>


</div>


<button class="bottone genera" onclick="generaProgramma()">

GENERA PROGRAMMA CUBETTI

</button>


<div id="risultato"></div>


</div>

</div>


<script>


let giorniSelezionati=[7,28,60];



window.onload=function(){

let oggi=new Date();

oggi.setMinutes(
oggi.getMinutes()-oggi.getTimezoneOffset()
);


document.getElementById("data").value =
oggi.toISOString().split("T")[0];


azzeraCampi();

};



function azzeraCampi(){

document.getElementById("impianto").value="";
document.getElementById("cantiere").value="";
document.getElementById("posizione").value="";
document.getElementById("verbale").value="";
document.getElementById("miscele").value="1";


giorniSelezionati=[7,28,60];


}





function modificaMiscele(valore){

let campo=document.getElementById("miscele");

let numero=parseInt(campo.value)+valore;


if(numero<1){

numero=1;

}


campo.value=numero;


}
function selezionaGiorno(button,giorno){


let posizione=
giorniSelezionati.indexOf(giorno);



if(posizione>=0){


giorniSelezionati.splice(posizione,1);


button.classList.remove("attivo");


}
else{


giorniSelezionati.push(giorno);


button.classList.add("attivo");


}



giorniSelezionati.sort(function(a,b){

return a-b;

});


}





function testoGiorni(giorni){

if(giorni===1){

return "1 giorno";

}

return giorni+" giorni";

}





function titoloRotturaTesto(giorni){

if(giorni===1){

return "Rottura 1 giorno";

}

return "Rotture a "+giorni+" giorni";

}






function formatoData(data){


return data.toLocaleDateString("it-IT");


}






function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(
nuova.getDate()+giorni
);


return nuova;


}






function formatoGoogle(data,ora){


let anno=data.getFullYear();


let mese=
String(data.getMonth()+1).padStart(2,"0");


let giorno=
String(data.getDate()).padStart(2,"0");



return anno+mese+giorno+"T"+ora;


}



function acquisisciPosizione(){

let pulsante=document.querySelector(".gps");

pulsante.innerHTML="⏳ RICERCA GPS...";


if(!navigator.geolocation){

alert("GPS non disponibile");

pulsante.innerHTML="RILEVA POSIZIONE CANTIERE";

return;

}


navigator.geolocation.getCurrentPosition(

function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let link=
"https://maps.google.com/?q="+lat+","+lon;


document.getElementById("posizione").value=link;


pulsante.innerHTML="✓ POSIZIONE ACQUISITA";


},


function(){

pulsante.innerHTML="RILEVA POSIZIONE CANTIERE";

alert("Attiva la posizione GPS e riprova");


},


{
enableHighAccuracy:false,
timeout:5000,
maximumAge:60000
}


);


}
function creaLinkGoogle(titolo,inizio,fine,descrizione,posizione){



return(

"https://calendar.google.com/calendar/render"+
"?action=TEMPLATE"+
"&text="+encodeURIComponent(titolo)+
"&dates="+inizio+"%2F"+fine+
"&details="+encodeURIComponent(descrizione)+
(posizione ?
"&location="+encodeURIComponent(posizione)
:
"")

);


}
function generaProgramma(){


let impianto =
document.getElementById("impianto").value.trim();


let cantiere =
document.getElementById("cantiere").value.trim();


let posizione =
document.getElementById("posizione").value.trim();


let valoreData =
document.getElementById("data").value;


let miscele =
Number(document.getElementById("miscele").value);


let verbale =
document.getElementById("verbale").value.trim() || "non inserito";



if(!impianto){

alert("Inserire l'impianto");

return;

}



if(!valoreData){

alert("Inserire la data prelievo");

return;

}



if(giorniSelezionati.length===0){

alert("Selezionare almeno un giorno di rottura");

return;

}




let parti=valoreData.split("-");


let data=new Date(

Number(parti[0]),
Number(parti[1])-1,
Number(parti[2])

);





let cubettiPerGiornata =
miscele*2;


let cubettiTotali =
cubettiPerGiornata *
giorniSelezionati.length;






/***********************
 REPORT WHATSAPP
************************/


let messaggioWhatsApp =

"REPORT PRELIEVO\n\n"+
"Impianto: "+impianto+"\n"+
(cantiere ? "Cantiere: "+cantiere+"\n":"")+
(posizione ? "Posizione: "+posizione+"\n":"")+
"Data prelievo: "+formatoData(data)+"\n"+
"Numero miscele: "+miscele+"\n"+
"Cubetti totali: "+cubettiTotali+"\n"+
"Verbale: "+verbale+
"\n\nPROGRAMMA ROTTURE\n";





giorniSelezionati.forEach(function(giorno){


let dataRottura=
aggiungiGiorni(data,giorno);



messaggioWhatsApp +=

testoGiorni(giorno)+
" - "+
formatoData(dataRottura)+
" - "+
cubettiPerGiornata+
" provini\n";


});



messaggioWhatsApp +=

"\nRITIRO CUBETTI: "+
cubettiTotali;



let linkWhatsApp =

"https://wa.me/?text="+
encodeURIComponent(messaggioWhatsApp);






let risultato="";





/***********************
 BOX REPORT
************************/


let titoloReport =

" Report Prelievo - "+
impianto+
" - "+
formatoData(data);


let descrizioneReport =

"Impianto: "+impianto+"\n"+
(cantiere ? "Cantiere: "+cantiere+"\n":"")+
(posizione ? "Posizione: "+posizione+"\n":"")+
"Data prelievo: "+formatoData(data)+"\n"+
"Numero miscele: "+miscele+"\n"+
"Cubetti totali: "+cubettiTotali+"\n"+
"Verbale: "+verbale;
let linkReportGoogle =

creaLinkGoogle(

titoloReport,

formatoGoogle(data,"080000"),

formatoGoogle(data,"090000"),

descrizioneReport,

posizione

);




risultato += `

<div class="evento">


<div class="titoloEvento">

REPORT PRELIEVO

</div>



<div class="evidenza">

${cubettiTotali} CUBETTI TOTALI

</div>



<div class="datoEvento">

Impianto: ${impianto}

</div>



<div class="datoEvento">

Miscele: ${miscele}

</div>



<a class="bottoneWhatsApp"

href="${linkWhatsApp}"

target="_blank">

INVIA REPORT WHATSAPP

</a>



<a class="bottoneGoogle"

href="${linkReportGoogle}"

target="_blank"

onclick="calendarioInserito(this)">

INSERISCI REPORT GOOGLE CALENDAR

</a>


</div>

`;




/***********************
 ROTTURE GOOGLE
************************/


giorniSelezionati.forEach(function(giorno){


let dataRottura=
aggiungiGiorni(data,giorno);




let titoloRottura=

"Rotture a"+
testoGiorni(giorno)+
" - "+
cubettiPerGiornata+
" provini - "+
impianto+
" - Prelievo "+
formatoData(data);





let descrizioneRottura=

"Impianto: "+impianto+
(cantiere ? "\nCantiere: "+cantiere : "")+
"\nEtà maturazione: "+testoGiorni(giorno)+
"\nNumero provini: "+cubettiPerGiornata+
"\nData prelievo: "+formatoData(data);



let linkRottura=

creaLinkGoogle(

titoloRottura,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizioneRottura,

posizione

);





risultato += `

<div class="evento">


<div class="titoloEvento">

ROTTURE A ${testoGiorni(giorno)}

</div>



<div class="evidenza">

${cubettiPerGiornata} PROVINI

</div>



<div class="datoEvento">

Data rottura: ${formatoData(dataRottura)}

</div>



<a class="bottoneGoogle"

href="${linkRottura}"

target="_blank"

onclick="calendarioInserito(this)">

INSERISCI ROTTURE GOOGLE CALENDAR

</a>


</div>

`;



});
 /***********************
 RITIRO CUBETTI GOOGLE
************************/


let dataRitiro =
aggiungiGiorni(data,1);



let titoloRitiro =

"EDILTEST - Ritiro "+
cubettiTotali+
" cubetti - "+
impianto+
" - Prelievo "+
formatoData(data);





let descrizioneRitiro =

"Impianto: "+
impianto+
"\nNumero cubetti: "+
cubettiTotali+
"\nData prelievo: "+
formatoData(data);





let linkRitiro =

creaLinkGoogle(

titoloRitiro,

formatoGoogle(dataRitiro,"080000"),

formatoGoogle(dataRitiro,"090000"),

descrizioneRitiro,

posizione

);





risultato += `

<div class="evento eventoRitiro">


<div class="titoloEvento">

RITIRO CUBETTI

</div>



<div class="evidenza">

${cubettiTotali} CUBETTI DA RITIRARE

</div>



<a class="bottoneGoogle"

href="${linkRitiro}"

target="_blank"

onclick="calendarioInserito(this)">

INSERISCI RITIRO GOOGLE CALENDAR

</a>


</div>

`;









document.getElementById("risultato").innerHTML =
risultato;


}






function calendarioInserito(pulsante){


pulsante.classList.add("bottoneInserito");


pulsante.innerHTML="✓ GIÀ INSERITO";


pulsante.style.pointerEvents="none";


}


 /***********************
 CONTROLLO DATI FINALI
************************/


function controlloDati(){


let impianto =
document.getElementById("impianto").value.trim();


let data =
document.getElementById("data").value;


let miscele =
Number(document.getElementById("miscele").value);



if(!impianto){


alert("Inserire il nome impianto");


return false;


}



if(!data){


alert("Inserire la data del prelievo");


return false;


}



if(miscele < 1){


alert("Numero miscele non valido");


return false;


}



if(giorniSelezionati.length===0){


alert("Selezionare almeno un giorno di rottura");


return false;


}



return true;


}






/***********************
 BLOCCO GENERAZIONE
************************/


let vecchiaGenera = generaProgramma;



generaProgramma = function(){



if(!controlloDati()){


return;


}



vecchiaGenera();


};




 /***********************
 SISTEMA PULSANTI GIORNI
************************/


window.addEventListener("load",function(){



document.querySelectorAll(".giorno").forEach(function(button){



let giorno =
Number(button.innerText);



if(giorniSelezionati.includes(giorno)){


button.classList.add("attivo");


}

else{


button.classList.remove("attivo");


}



});


});



</script>


</body>


</html>
