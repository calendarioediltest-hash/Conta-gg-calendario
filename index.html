<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDILTEST 2.0</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:15px;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#cbd5e1,#f8fafc);
color:#16324f;

}



.container{

max-width:540px;
margin:auto;

}



.app{

background:rgba(255,255,255,0.75);
backdrop-filter:blur(18px);
border-radius:30px;
padding:22px;
box-shadow:0 15px 40px rgba(0,0,0,0.15);

}



.titolo{

font-family:'Montserrat',sans-serif;
text-align:center;
font-size:28px;
font-weight:700;
color:#0b416b;

}
.eventoRitiro{
background:#dcfce7;
border-left:8px solid #16a34a;
}

.eventoRitiro .titoloEvento{
color:#15803d;
}

.eventoRitiro .evidenza{
color:#15803d;
}


.bottoneInserito{
background:#16a34a !important;
color:white;
cursor:default;
transform:none !important;
}


.sottotitolo{

text-align:center;
font-size:12px;
color:#64748b;
margin-bottom:20px;

}



.sezione{

font-family:'Montserrat',sans-serif;
font-size:17px;
font-weight:700;
color:#0b416b;
margin-top:20px;

}



label{

display:block;
margin-top:12px;
font-size:14px;
font-weight:600;

}



.info{

font-size:11px;
color:#64748b;
font-weight:400;

}



input{

width:100%;
height:50px;
border:0;
border-radius:15px;
padding:10px;
margin-top:5px;
font-size:16px;
background:white;

}



input:focus{

outline:none;
box-shadow:0 0 0 3px rgba(11,65,107,0.20);

}



button{

cursor:pointer;
transition:0.2s;

}



button:hover{

transform:scale(1.03);

}



button:active{

transform:scale(0.97);

}



.bottone{

width:100%;
height:55px;
border:0;
border-radius:16px;
margin-top:12px;
font-size:15px;
font-weight:700;
color:white;

}



.gps{

background:#16a34a;

}



.genera{

height:65px;
background:#0b416b;
font-size:17px;

}


  .contatore{

display:flex;
justify-content:center;
align-items:center;
gap:15px;

}



.contatore button{

width:55px;
height:50px;
border:0;
border-radius:15px;
background:#0b416b;
color:white;
font-size:28px;

}



.contatore input{

width:80px;
text-align:center;
font-size:22px;
font-weight:bold;

}



.giorni{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:15px;

}



.giorno{

height:50px;
border:0;
border-radius:15px;
background:white;
color:#0b416b;
font-size:16px;
font-weight:700;

}



.giorno.attivo{

background:#0b416b;
color:white;

}



.evento{

background:white;
border-radius:18px;
padding:15px;
margin-top:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);

}



.titoloEvento{

font-size:16px;
font-weight:700;
color:#0b416b;
margin-bottom:8px;

}



.datoEvento{

font-size:14px;
margin-top:6px;

}



.evidenza{

font-size:20px;
font-weight:800;
color:#0b416b;
margin:8px 0;

}



.bottoneGoogle{

display:block;
margin-top:12px;
padding:15px;
background:#2563eb;
border-radius:15px;
color:white;
text-align:center;
text-decoration:none;
font-weight:700;

}



.bottoneWhatsApp{

display:block;
margin-top:12px;
padding:15px;
background:#16a34a;
border-radius:15px;
color:white;
text-align:center;
text-decoration:none;
font-weight:700;

}



</style>

</head>


<body>


<div class="container">


<div class="app">


<div class="titolo">

EDILTEST 2.0

</div>


<div class="sottotitolo">

Gestione prove calcestruzzo<br>

Prelievi • Rotture • Calendario • Comunicazioni

</div>


<div class="sezione">

DATI PRELIEVO

</div>


<label>

Impianto

<span class="info">(obbligatorio)</span>

</label>


<input id="impianto" placeholder="Nome impianto">


<label>

Cantiere

<span class="info">(opzionale)</span>

</label>


<input id="cantiere" placeholder="Nome cantiere">


<label>

Posizione cantiere

<span class="info">(indirizzo o link Maps)</span>

</label>


<input id="posizione" placeholder="Indirizzo cantiere o link Maps">


<button class="bottone gps" onclick="acquisisciPosizione()">

RILEVA POSIZIONE CANTIERE

</button>


<label>

Data prelievo

<span class="info">(automatica)</span>

</label>


<input type="date" id="data">


<label>

Numero miscele

<span class="info">(obbligatorio)</span>

</label>


<div class="contatore">


<button onclick="modificaMiscele(-1)">

−

</button>


<input id="miscele" value="1" readonly>


<button onclick="modificaMiscele(1)">

+

</button>


</div>


<label>

Numero verbale

<span class="info">(opzionale)</span>

</label>


<input id="verbale" placeholder="Numero verbale">


<div class="sezione">

PROGRAMMA ROTTURE

</div>


<div class="info">

Seleziona i giorni di prova da programmare

</div>


<div class="giorni">


<button class="giorno" onclick="selezionaGiorno(this,1)">

1

</button>


<button class="giorno" onclick="selezionaGiorno(this,2)">

2

</button>


<button class="giorno" onclick="selezionaGiorno(this,3)">

3

</button>


<button class="giorno" onclick="selezionaGiorno(this,4)">

4

</button>


<button class="giorno attivo" onclick="selezionaGiorno(this,7)">

7

</button>


<button class="giorno" onclick="selezionaGiorno(this,14)">

14

</button>


<button class="giorno attivo" onclick="selezionaGiorno(this,28)">

28

</button>


<button class="giorno attivo" onclick="selezionaGiorno(this,60)">

60

</button>


</div><button class="bottone genera" onclick="generaProgramma()">

GENERA PROGRAMMA CUBETTI

</button>


<div id="risultato">

</div>


</div>


</div>


<script>


let giorniSelezionati=[7,28,60];



window.onload=function(){


let oggi=new Date();


oggi.setMinutes(
oggi.getMinutes()-oggi.getTimezoneOffset()
);



document.getElementById("data").value =
oggi.toISOString().split("T")[0];


caricaDati();


};


function salvaDati(){

}


localStorage.setItem(
"ediltest_impianto",
document.getElementById("impianto").value
);


localStorage.setItem(
"ediltest_cantiere",
document.getElementById("cantiere").value
);


localStorage.setItem(
"ediltest_posizione",
document.getElementById("posizione").value
);


localStorage.setItem(
"ediltest_miscele",
document.getElementById("miscele").value
);


localStorage.setItem(
"ediltest_verbale",
document.getElementById("verbale").value
);


localStorage.setItem(
"ediltest_data",
document.getElementById("data").value
);


localStorage.setItem(
"ediltest_giorni",
JSON.stringify(giorniSelezionati)
);


}

function caricaDati(){

document.getElementById("impianto").value="";
document.getElementById("cantiere").value="";
document.getElementById("posizione").value="";
document.getElementById("verbale").value="";
document.getElementById("miscele").value="1";

}
document.getElementById("impianto").value =
localStorage.getItem("ediltest_impianto") || "";


document.getElementById("cantiere").value =
localStorage.getItem("ediltest_cantiere") || "";


document.getElementById("posizione").value =
localStorage.getItem("ediltest_posizione") || "";


document.getElementById("miscele").value =
localStorage.getItem("ediltest_miscele") || "1";


document.getElementById("verbale").value =
localStorage.getItem("ediltest_verbale") || "";


let dataSalvata =
localStorage.getItem("ediltest_data");


if(dataSalvata){

document.getElementById("data").value=dataSalvata;

}



let giorniSalvati =
localStorage.getItem("ediltest_giorni");


if(giorniSalvati){

giorniSelezionati =
JSON.parse(giorniSalvati);

}


}



document.querySelectorAll("input").forEach(function(campo){


campo.addEventListener(
"input",
salvaDati
);


});



function modificaMiscele(valore){


let campo =
document.getElementById("miscele");


let numero =
parseInt(campo.value)+valore;


if(numero<1){

numero=1;

}


campo.value=numero;

salvaDati();


}




function selezionaGiorno(button,giorno){


let posizione =
giorniSelezionati.indexOf(giorno);



if(posizione>=0){


giorniSelezionati.splice(posizione,1);


button.classList.remove("attivo");


}

else{


giorniSelezionati.push(giorno);


button.classList.add("attivo");


}



giorniSelezionati.sort(function(a,b){

return a-b;

});


salvaDati();


}
  
function aggiungiGiorni(data,giorni){


let nuova =
new Date(data);



nuova.setDate(
nuova.getDate()+giorni
);



return nuova;


}





function formatoData(data){


return data.toLocaleDateString("it-IT");


}
function testoGiorni(giorni){

return giorni === 1 
? "1 giorno"
: giorni + " giorni";

}



function formatoGoogle(data,ora){


let anno =
data.getFullYear();


let mese =
String(data.getMonth()+1).padStart(2,"0");


let giorno =
String(data.getDate()).padStart(2,"0");


return anno+mese+giorno+"T"+ora;


}





function acquisisciPosizione(){



if(!navigator.geolocation){


alert("Geolocalizzazione non disponibile");


return;


}





navigator.geolocation.getCurrentPosition(



function(pos){


let lat =
pos.coords.latitude;


let lon =
pos.coords.longitude;



let link =

"https://maps.google.com/?q="+lat+","+lon;




document.getElementById("posizione").value =
link;



document.querySelector(".gps").innerHTML =

"✓ POSIZIONE ACQUISITA";



salvaDati();



},



function(){


alert("Impossibile rilevare la posizione");


}



);



}





function creaLinkGoogle(titolo,inizio,fine,descrizione,posizione){



return(

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="+encodeURIComponent(titolo)

+

"&dates="+inizio+"%2F"+fine

+

"&details="+encodeURIComponent(descrizione)

+

(posizione ?

"&location="+encodeURIComponent(posizione)

:

"")



);



}
  
function generaProgramma(){


let impianto =
document.getElementById("impianto").value.trim();


let cantiere =
document.getElementById("cantiere").value.trim();


let posizione =
document.getElementById("posizione").value.trim();


let valoreData =
document.getElementById("data").value;


let miscele =
Number(document.getElementById("miscele").value);


let verbale =
document.getElementById("verbale").value.trim() || "non inserito";



if(!impianto){


alert("Inserire l'impianto");


return;


}



if(giorniSelezionati.length===0){


alert("Selezionare almeno un giorno di rottura");


return;


}



let parti =
valoreData.split("-");



let data =
new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);




let cubettiPerGiornata =

miscele * 2;



let cubettiTotali =

cubettiPerGiornata * giorniSelezionati.length;




let testoCantiere =

cantiere ?

"\nCantiere: "+cantiere

:

"";




let descrizioneReport =


"EDILTEST 2.0\n\n"+

"REPORT PRELIEVO\n\n"+

"Impianto: "+impianto+

testoCantiere+

"\n\n"+

(posizione ?

"Posizione cantiere:\n"+posizione+"\n\n"

:

"")+

"Data prelievo: "+formatoData(data)+"\n"+

"Numero miscele: "+miscele+"\n"+

"Cubetti per giornata: "+cubettiPerGiornata+"\n"+

"Cubetti totali previsti: "+cubettiTotali+"\n"+

"Verbale: "+verbale;




let messaggioWhatsApp = descrizioneReport+

"\n\nPROGRAMMA ROTTURE\n";





giorniSelezionati.forEach(function(giorno){


let dataRottura =
aggiungiGiorni(data,giorno);



messaggioWhatsApp +=
testoGiorni(giorno)+": "+

formatoData(dataRottura)

+"\n";


});





let linkWhatsApp =


"https://wa.me/?text="+

encodeURIComponent(messaggioWhatsApp);





let linkReportGoogle =


creaLinkGoogle(

"Report prelievo - "+impianto,

formatoGoogle(data,"080000"),

formatoGoogle(data,"090000"),

descrizioneReport,

posizione

);





let risultato = "";





risultato += `


<div class="evento">


<div class="titoloEvento">

REPORT PRELIEVO

</div>



<div class="titoloEvento">

ROTTURA ${testoGiorni(giorno)}

</div>



<div class="datoEvento">

Impianto: ${impianto}

</div>



<div class="datoEvento">

Miscele: ${miscele}

</div>



<div class="datoEvento">

Cubetti per giornata: ${cubettiPerGiornata}

</div>



<div class="datoEvento">

Posizione: ${posizione || "non inserita"}

</div>



<a class="bottoneGoogle"

href="${linkReportGoogle}"

target="_blank">

INSERISCI REPORT GOOGLE CALENDAR

</a>



<a class="bottoneWhatsApp"

href="${linkWhatsApp}"

target="_blank">

INVIA REPORT WHATSAPP

</a>



</div>


`;



giorniSelezionati.forEach(function(giorno){


let dataRottura =

aggiungiGiorni(data,giorno);



let titoloRottura =


"Rottura "+

testoGiorni(giorno)+

" - "+

cubettiPerGiornata+

" cubi - "+

impianto+

" - Prelievo "+

formatoData(data);





let descrizioneRottura =


"EDILTEST 2.0\n\n"+

"ROTTURA PROVINI\n\n"+

"Impianto: "+impianto+"\n"+

(cantiere ?

"Cantiere: "+cantiere+"\n"

:

"")+

(posizione ?

"Posizione cantiere:\n"+posizione+"\n"

:

"")+

"\n"+

"Data prelievo: "+formatoData(data)+"\n"+

"Età provino: "+testoGiorni(giorno)+"\n"+

"Cubetti previsti: "+cubettiPerGiornata+"\n"+

"Totale cubetti programmati: "+cubettiTotali;




let linkRottura =


creaLinkGoogle(

titoloRottura,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizioneRottura,

posizione

);





risultato += `


<div class="evento">


<div class="titoloEvento">

ROTTURA ${giorno} GIORNI

</div>



<div class="evidenza">

${cubettiPerGiornata} CUBI

</div>



<div class="datoEvento">

Data rottura: ${formatoData(dataRottura)}

</div>



<div class="datoEvento">

Data prelievo: ${formatoData(data)}

</div>



<div class="datoEvento">

Impianto: ${impianto}

</div>



<a class="bottoneGoogle"

href="${linkRottura}"

target="_blank">

INSERISCI ROTTURA GOOGLE CALENDAR

</a>



</div>


`;



});





// pulsante ritiro integrato nel programma

let dataRitiro =

aggiungiGiorni(data,1);





let titoloRitiro =


"Ritiro cubetti - "+

cubettiTotali+

" cubi - "+

impianto+

" - Prelievo "+

formatoData(data);





let descrizioneRitiro =


"EDILTEST 2.0\n\n"+

"RITIRO CUBETTI CANTIERE\n\n"+

"Impianto: "+impianto+"\n"+

(cantiere ?

"Cantiere: "+cantiere+"\n"

:

"")+

(posizione ?

"Posizione cantiere:\n"+posizione+"\n"

:

"")+

"\n"+

"Cubetti totali da ritirare: "+cubettiTotali+"\n"+

"Data prelievo: "+formatoData(data)+"\n"+

"Data ritiro: "+formatoData(dataRitiro);





let linkRitiro =


creaLinkGoogle(

titoloRitiro,

formatoGoogle(dataRitiro,"080000"),

formatoGoogle(dataRitiro,"090000"),

descrizioneRitiro,

posizione

);





risultato += `

<div class="evento eventoRitiro">

<div class="titoloEvento">

RITIRO CUBETTI

</div>



<div class="evidenza">

${cubettiTotali} CUBI DA RITIRARE

</div>



<div class="datoEvento">

Data ritiro: ${formatoData(dataRitiro)}

</div>



<a class="bottoneGoogle"

href="${linkRitiro}"

target="_blank"

onclick="ritiroInserito(this)">

INSERISCI RITIRO GOOGLE CALENDAR

</a>


</div>


`;





document.getElementById("risultato").innerHTML =

risultato;



salvaDati();



}
  


// controllo automatico compilazione campi

document.querySelectorAll("input").forEach(function(campo){


campo.addEventListener("input",function(){


salvaDati();


});


});





// aggiorna i giorni selezionati quando si apre l'app

window.addEventListener("load",function(){



document.querySelectorAll(".giorno").forEach(function(button){



let giorno =

Number(button.innerText);



if(giorniSelezionati.includes(giorno)){


button.classList.add("attivo");


}

else{


button.classList.remove("attivo");


}



});



});






// controllo dati prima della generazione

function controlloDati(){



let impianto =

document.getElementById("impianto").value.trim();



let data =

document.getElementById("data").value;



let miscele =

Number(document.getElementById("miscele").value);





if(!impianto){


alert("Inserire il nome impianto");


return false;


}





if(!data){


alert("Inserire la data del prelievo");


return false;


}





if(miscele<1){


alert("Numero miscele non valido");


return false;


}





if(giorniSelezionati.length===0){


alert("Selezionare almeno una giornata di rottura");


return false;


}





return true;



}





// blocco sicurezza per generazione programma

let vecchiaGenera = generaProgramma;



generaProgramma=function(){



if(!controlloDati()){


return;


}



vecchiaGenera();



};









// evita date non valide

function creaDataSicura(valore){


if(!valore){


return new Date();


}



let p = valore.split("-");



return new Date(

Number(p[0]),

Number(p[1])-1,

Number(p[2])

);



}
function ritiroInserito(pulsante){

pulsante.classList.add("bottoneInserito");

pulsante.innerHTML="✓ GIÀ INSERITO";

}
</script>

</body>
</html>
