<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prove Calcestruzzo</title>


<style>

body{

font-family:Arial,sans-serif;

background:#5b5b5b;

margin:0;

padding:15px;

color:white;

}


.container{

max-width:520px;

margin:auto;

background:#292929;

padding:20px;

border-radius:20px;

box-shadow:0 0 20px #222;

}


h1{

text-align:center;

color:#f59e0b;

font-size:30px;

}


h3{

font-size:22px;

}


label{

font-size:18px;

font-weight:bold;

}


input{

width:100%;

height:60px;

box-sizing:border-box;

padding:12px;

margin:8px 0 15px;

border:0;

border-radius:12px;

font-size:20px;

}



/* MISCELE */

.contatore{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

}


.contatore input{

width:90px;

text-align:center;

font-size:30px;

font-weight:bold;

}


.contatore button{

width:75px;

height:65px;

font-size:35px;

}




/* BOTTONI */


button{

width:100%;

height:70px;

margin-top:15px;

border:0;

border-radius:15px;

background:#d97706;

color:white;

font-size:22px;

font-weight:bold;

}



button:active{

transform:scale(.96);

}


.nuovo{

background:#16a34a;

}


.reset{

background:#dc2626;

}




/* GIORNI TOUCH */


.prova{

height:70px;

display:flex;

align-items:center;

justify-content:center;

background:#3f3f3f;

border-radius:15px;

margin:12px 0;

font-size:21px;

font-weight:bold;

cursor:pointer;

border:2px solid transparent;

transition:.2s;

}



.prova input{

display:none;

}



.prova.attivo{

background:#f59e0b;

color:#111;

box-shadow:0 0 18px #f59e0b;

border:2px solid white;

transform:scale(1.03);

}




/* RISULTATO */

.risultato{

background:#111;

margin-top:20px;

padding:15px;

border-radius:15px;

font-size:18px;

}



.dataGrande{

font-size:36px;

font-weight:bold;

color:#f59e0b;

margin:15px 0;

}



/* LINK GOOGLE */

.link{

display:block;

background:#2563eb;

color:white;

padding:18px;

border-radius:12px;

margin-top:15px;

text-align:center;

text-decoration:none;

font-size:18px;

}



.fatto{

background:#16a34a !important;

}


</style>


</head>


<body>


<div class="container">


<h1>
🧱 Prove Calcestruzzo
</h1>



<label>

Impianto

</label>


<input

id="impianto"

placeholder="Nome impianto">





<label>

Data prelievo

</label>


<input

type="date"

id="data">





<label>

Numero miscele

</label>


<div class="contatore">


<button onclick="cambiaMiscele(-1)">

−

</button>


<input

id="miscele"

value="1"

readonly>


<button onclick="cambiaMiscele(1)">

+

</button>


</div>





<label>

Numero verbale

</label>


<input

id="verbale"

placeholder="Numero verbale">





<h3>

Giorni rottura

</h3>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="1">

Rottura a 1 giorno

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="3">

Rottura a 3 giorni

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="4">

Rottura a 4 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="7" checked>

Rottura a 7 giorni

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="14">

Rottura a 14 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="28" checked>

Rottura a 28 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="60" checked>

Rottura a 60 giorni

</div>





<button onclick="genera()">

🚀 CREA CALENDARIO

</button>





<button class="nuovo" onclick="nuovoPrelievo()">

➕ NUOVO PRELIEVO

</button>





<button class="reset" onclick="resetStato()">

🗑 RESET IMPORTAZIONI

</button>





<div id="risultato" class="risultato">

Nessun evento creato

</div>



</div>
<script>


// Imposta data di oggi

document.getElementById("data").valueAsDate=new Date();




// + e - miscele

function cambiaMiscele(valore){

let campo=document.getElementById("miscele");

let numero=parseInt(campo.value)+valore;


if(numero<1){

numero=1;

}


campo.value=numero;

}




// Attiva/disattiva rotture

function selezionaGiorno(elemento){


let check=elemento.querySelector(".giorno");


check.checked=!check.checked;


elemento.classList.toggle(

"attivo",

check.checked

);


}




// Aggiunge giorni

function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(

nuova.getDate()+giorni

);


return nuova;

}





function formatoData(data){


return data.toLocaleDateString("it-IT");


}





function getGiorni(){


let lista=[];


document.querySelectorAll(".giorno:checked")

.forEach(function(x){


lista.push(Number(x.value));


});


return lista;

}





// formato Google Calendar

function formatoGoogle(data,ora){


let anno=data.getFullYear();

let mese=String(data.getMonth()+1).padStart(2,"0");

let giorno=String(data.getDate()).padStart(2,"0");


return anno+mese+giorno+"T"+ora;


}





function creaLinkGoogle(titolo,inizio,fine,descrizione){


return (

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="

+

encodeURIComponent(titolo)

+

"&dates="

+

inizio

+

"%2F"

+

fine

+

"&details="

+

encodeURIComponent(descrizione)

);


}





function importato(id){


return localStorage.getItem(id)==="si";


}





function segnaImportato(id,bottone){


localStorage.setItem(id,"si");


bottone.innerHTML="✓ Inserito";


bottone.classList.add("fatto");


}





function creaBottone(link,id){


return `


<a

class="${importato(id) ? "link fatto":"link"}"

href="${link}"

target="_blank"

onclick="segnaImportato('${id}',this)">


${importato(id) ? "✓ Inserito":"Apri calendario Google"}


</a>


`;

}





// GENERAZIONE CALENDARIO

function genera(){



let impianto=document
.getElementById("impianto")
.value.trim();



let valoreData=document
.getElementById("data")
.value;



let miscele=Number(
document.getElementById("miscele").value
);



let verbale=document
.getElementById("verbale")
.value.trim();




if(!impianto || !valoreData){


alert("Inserire impianto e data prelievo");

return;

}





let cubi=miscele*2;




let p=valoreData.split("-");



let dataPrelievo=new Date(

Number(p[0]),

Number(p[1])-1,

Number(p[2])

);





let giorni=getGiorni();



if(giorni.length===0){


alert("Selezionare almeno una rottura");

return;


}





let html=`


<b style="font-size:24px;color:#f59e0b">

PRELIEVO

</b>


<div class="dataGrande">

${formatoData(dataPrelievo)}

</div>


Impianto:

<b>${impianto}</b>


<br><br>


Miscele:

<b>${miscele}</b>


<br>


Cubi per rottura:

<b>${cubi}</b>

`;





if(verbale!=""){


html+=`

<br>

Verbale:

<b>${verbale}</b>

`;

}







giorni.forEach(function(giorno){



let dataRottura=

aggiungiGiorni(

dataPrelievo,

giorno

);




let testoData=

formatoData(dataRottura);





let titolo=

"Rottura "

+

giorno

+

" giorni - "

+

impianto;





let descrizione=

"PROVA DI COMPRESSIONE\n\n"

+

"Impianto: "

+

impianto

+

"\n"

+

"Verbale: "

+

verbale

+

"\n"

+

"Miscele: "

+

miscele

+

"\n"

+

"Cubi: "

+

cubi

+

"\n\n"

+

"Data rottura: "

+

testoData;





let link=

creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);





let id=

"rottura_"

+

impianto

+

"_"

+

valoreData

+

"_"

+

giorno;







html+=`


<hr>


<b style="font-size:22px">

Rottura ${giorno} giorni

</b>


<div class="dataGrande">

${testoData}

</div>


${creaBottone(link,id)}


`;



});





document.getElementById("risultato").innerHTML=html;


}







// NUOVO PRELIEVO

function nuovoPrelievo(){


document.getElementById("verbale").value="";


document.getElementById("miscele").value=1;


document.getElementById("data").valueAsDate=new Date();


document.getElementById("risultato").innerHTML=

"Nessun evento creato";


}





// RESET MEMORIA

function resetStato(){


if(confirm("Cancellare stato importazioni?")){


localStorage.clear();


alert("Reset completato");


}


}


</script>



</body>


</html>
