<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prove Calcestruzzo</title>


<style>


body{

font-family:Arial,sans-serif;

background:#555;

margin:0;

padding:15px;

color:white;

}



.container{

max-width:520px;

margin:auto;

background:#292929;

padding:20px;

border-radius:20px;

box-shadow:0 0 20px #222;

}



h1{

text-align:center;

color:#f59e0b;

font-size:30px;

}



label{

font-size:18px;

font-weight:bold;

}



input{

width:100%;

height:60px;

box-sizing:border-box;

padding:12px;

margin:8px 0 15px;

border:0;

border-radius:12px;

font-size:20px;

}



/* MISCELE */

.contatore{

display:flex;

align-items:center;

justify-content:center;

gap:15px;

}



.contatore input{

width:90px;

text-align:center;

font-size:30px;

font-weight:bold;

}



.contatore button{

width:75px;

height:65px;

font-size:35px;

}



/* BOTTONI */


button{

width:100%;

height:70px;

margin-top:20px;

border:0;

border-radius:15px;

background:#d97706;

color:white;

font-size:22px;

font-weight:bold;

}



/* GIORNI */

.prova{

height:70px;

display:flex;

align-items:center;

justify-content:center;

background:#444;

border-radius:15px;

margin:12px 0;

font-size:21px;

font-weight:bold;

cursor:pointer;

transition:.2s;

border:2px solid transparent;

}



.prova input{

display:none;

}



.prova.attivo{

background:#f59e0b;

color:#111;

border-color:white;

box-shadow:0 0 20px #f59e0b;

transform:scale(1.03);

}





/* RISULTATO */

.risultato{

background:#111;

margin-top:20px;

padding:15px;

border-radius:15px;

font-size:18px;

}



.dataGrande{

font-size:36px;

font-weight:bold;

color:#f59e0b;

margin:15px 0;

}



.link{

display:block;

background:#2563eb;

color:white;

padding:18px;

border-radius:12px;

margin-top:15px;

text-align:center;

text-decoration:none;

font-size:18px;

}



.fatto{

background:#16a34a !important;

}



</style>


</head>


<body>


<div class="container">



<h1>

Prove Calcestruzzo

</h1>



<label>

Impianto

</label>


<input

id="impianto"

placeholder="Nome impianto">





<label>

Data prelievo

</label>


<input

type="date"

id="data">





<label>

Numero miscele

</label>



<div class="contatore">


<button onclick="cambiaMiscele(-1)">

-

</button>


<input

id="miscele"

value="1"

readonly>


<button onclick="cambiaMiscele(1)">

+

</button>


</div>





<label>

Numero verbale

</label>


<input

id="verbale"

placeholder="Numero verbale">





<h3>

Giorni rottura

</h3>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="1">

Rottura 1 giorno

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="3">

Rottura 3 giorni

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="4">

Rottura 4 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="7" checked>

Rottura 7 giorni

</div>





<div class="prova" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="14">

Rottura 14 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="28" checked>

Rottura 28 giorni

</div>





<div class="prova attivo" onclick="selezionaGiorno(this)">

<input class="giorno" type="checkbox" value="60" checked>

Rottura 60 giorni

</div>





<button onclick="genera()">

CREA CALENDARIO

</button>





<div id="risultato" class="risultato">

Nessun evento creato

</div>



</div><script>


document.getElementById("data").valueAsDate=new Date();



// CONTATORE MISCELE

function cambiaMiscele(valore){

let campo=document.getElementById("miscele");

let numero=parseInt(campo.value)+valore;


if(numero<1){

numero=1;

}


campo.value=numero;

}





// PULSANTI ROTTURA

function selezionaGiorno(elemento){


let check=elemento.querySelector(".giorno");


check.checked=!check.checked;


elemento.classList.toggle(

"attivo",

check.checked

);


}





// AGGIUNGE GIORNI

function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(

nuova.getDate()+giorni

);


return nuova;

}





function formatoData(data){


return data.toLocaleDateString("it-IT");


}





function getGiorni(){


let lista=[];


document.querySelectorAll(".giorno:checked")

.forEach(function(x){


lista.push(Number(x.value));


});


return lista;

}





// FORMATO GOOGLE

function formatoGoogle(data,ora){


let anno=data.getFullYear();

let mese=String(data.getMonth()+1).padStart(2,"0");

let giorno=String(data.getDate()).padStart(2,"0");


return anno+mese+giorno+"T"+ora;

}





// LINK CALENDARIO

function creaLinkGoogle(titolo,inizio,fine,descrizione){


return (

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="

+

encodeURIComponent(titolo)

+

"&dates="

+

inizio

+

"%2F"

+

fine

+

"&details="

+

encodeURIComponent(descrizione)

);


}





// CREA EVENTI

function genera(){



let impianto=document
.getElementById("impianto")
.value.trim();



let valoreData=document
.getElementById("data")
.value;



let miscele=Number(
document.getElementById("miscele").value
);



let verbale=document
.getElementById("verbale")
.value.trim();




if(!impianto || !valoreData){


alert("Inserire impianto e data prelievo");

return;

}




let cubi=miscele*2;




let parti=valoreData.split("-");



let dataPrelievo=new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);





let giorni=getGiorni();





if(giorni.length===0){


alert("Selezionare almeno una rottura");

return;


}





let html=`


<b style="font-size:24px;color:#f59e0b">

PRELIEVO

</b>


<div class="dataGrande">

${formatoData(dataPrelievo)}

</div>


Impianto:

<b>${impianto}</b>


<br><br>


Numero miscele:

<b>${miscele}</b>


<br>


Cubi per rottura:

<b>${cubi}</b>

`;





giorni.forEach(function(giorno){



let dataRottura=

aggiungiGiorni(

dataPrelievo,

giorno

);




let dataTesto=

formatoData(dataRottura);





// TITOLO EVENTO GOOGLE

let titolo=

cubi

+

" cubi - "

+

impianto

+

" - Prelievo "

+

formatoData(dataPrelievo);







let descrizione=

"PROVA CALCESTRUZZO\n\n"

+

"Impianto: "

+

impianto

+

"\n"

+

"Data prelievo: "

+

formatoData(dataPrelievo)

+

"\n"

+

"Verbale: "

+

verbale

+

"\n"

+

"Numero miscele: "

+

miscele

+

"\n"

+

"Cubi da rompere: "

+

cubi

+

"\n"

+

"Età provino: "

+

giorno

+

" giorni"

;






let link=

creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);







html+=`

<hr>


<b style="font-size:22px">

${giorno} giorni

</b>


<div class="dataGrande">

${dataTesto}

</div>


<a class="link"

href="${link}"

target="_blank">

Inserisci evento calendario

</a>


`;





});





document.getElementById("risultato").innerHTML=html;


}




</script>


</body>


</html>
