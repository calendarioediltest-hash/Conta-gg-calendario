<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestione Prove Calcestruzzo</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#4b5563;
    margin:0;
    padding:20px;
    color:white;
}


.box{
    max-width:520px;
    margin:auto;
    background:#1f2937;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 20px #000;
}


h1{
    text-align:center;
    color:#f59e0b;
}


label{
    font-weight:bold;
}


input{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border-radius:8px;
    border:0;
    font-size:16px;
    box-sizing:border-box;
}


.prova{
    background:#374151;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}


button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#f97316;
    color:white;
    font-size:17px;
}


.risultato{
    background:#111827;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}


.link{
    display:block;
    background:#dc2626;
    color:white;
    text-align:center;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    text-decoration:none;
}


</style>

</head>


<body>


<div class="box">


<h1>🏗️ Prove Calcestruzzo</h1>


<label>Nome impianto</label>

<input id="impianto" placeholder="es. Impianto Rossi">


<label>Data prelievo</label>

<input type="date" id="data">


<h3>🧱 Rotture cubetti</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
1 giorno
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="3">
3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="4">
4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="14">
14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
60 giorni
</div>


<button onclick="genera()">
📅 Genera calendario
</button>


<div id="risultato" class="risultato">
Nessun evento generato
</div>

<script>


// imposta data di oggi

document.getElementById("data").valueAsDate = new Date();




// aggiunge giorni alla data di prelievo

function aggiungiGiorni(data, giorni){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + giorni);

    return nuova;

}




// formato italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}




// prende prove selezionate

function getProve(){

    let lista=[];


    document.querySelectorAll(".giorno:checked").forEach(function(x){

        lista.push(Number(x.value));

    });


    return lista;

}






// crea link Google Calendar

function creaLink(titolo, dataEvento, descrizione){


    let anno =
    dataEvento.getFullYear();


    let mese =
    String(dataEvento.getMonth()+1).padStart(2,"0");


    let giorno =
    String(dataEvento.getDate()).padStart(2,"0");



    let inizio =
    anno + mese + giorno + "T090000";


    let fine =
    anno + mese + giorno + "T100000";



    let url =

    "https://calendar.google.com/calendar/render"
    +
    "?action=TEMPLATE"
    +
    "&text="
    +
    encodeURIComponent(titolo)

    +
    "&dates="
    +
    inizio
    +
    "%2F"
    +
    fine

    +
    "&details="
    +
    encodeURIComponent(descrizione);



    return url;

}






function genera(){


    let valore =
    document.getElementById("data").value;



    if(!valore){

        alert("Inserisci la data del prelievo");

        return;

    }




    let dataPrelievo =
    new Date(valore);



    let impianto =
    document.getElementById("impianto").value;



    if(!impianto){

        alert("Inserisci il nome impianto");

        return;

    }




    let prove =
    getProve();



    if(prove.length===0){

        alert("Seleziona almeno una rottura");

        return;

    }





    let dataTesto =
    formatoData(dataPrelievo);




    let html =

    "🏗️ <b>Report calcestruzzo</b><br>"
    +
    "Impianto: "
    +
    impianto
    +
    "<br>"
    +
    "Prelievo: "
    +
    dataTesto;




    let descrizioneReport =

    "🏗️ Report calcestruzzo\n\n"
    +
    "Impianto: "
    +
    impianto
    +
    "\n"
    +
    "Data prelievo: "
    +
    dataTesto;




    html +=

    "<a class='link' target='_blank' href='"

    +
    creaLink(

        "🏗️ Report calcestruzzo - " + impianto,

        dataPrelievo,

        descrizioneReport

    )

    +
    "'>📋 Apri Report Google Calendar</a>";

    



    prove.forEach(function(giorni){



        let dataRottura =
        aggiungiGiorni(dataPrelievo, giorni);



        let titolo =

        "🧱 Rottura cubetti "
        +
        giorni
        +
        " giorni - Prelievo "
        +
        dataTesto
        +
        " - "
        +
        impianto;



        let descrizione =

        "🧱 Prova compressione cubetti\n\n"
        +
        "Impianto: "
        +
        impianto
        +
        "\n"
        +
        "Data prelievo: "
        +
        dataTesto
        +
        "\n"
        +
        "Rottura prevista: "
        +
        formatoData(dataRottura)
        +
        "\n"
        +
        "Età provino: "
        +
        giorni
        +
        " giorni";



        html +=


        "<br><b>🧱 "
        +
        giorni
        +
        " giorni</b><br>"
        +
        formatoData(dataRottura);



        html +=


        "<a class='link' target='_blank' href='"

        +

        creaLink(

            titolo,

            dataRottura,

            descrizione

        )

        +

        "'>➕ Inserisci rottura in Google Calendar</a>";



    });




    document.getElementById("risultato").innerHTML = html;



}



</script>


</div>


</body>

</html>
