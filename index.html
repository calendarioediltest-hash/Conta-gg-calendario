<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotture Cubetti</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:0;
    box-sizing:border-box;
}


.prova{
    background:#334155;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}


button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:17px;
}


.blue{
    background:#2563eb;
}


.risultato{
    background:#334155;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}


</style>

</head>


<body>


<div class="container">


<h1>🧱 Rotture a compressione cubetti</h1>


<label>Campione / Cantiere</label>

<input id="campione" placeholder="es. Cantiere Rossi">


<label>Data confezionamento</label>

<input type="date" id="data">



<h3>Seleziona prove</h3>


<div class="prova">
<input type="checkbox" class="giorni" value="1">
+1 giorno (24 ore)
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="3">
+3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="4">
+4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="7" checked>
+7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="14">
+14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="28" checked>
+28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorni" value="60" checked>
+60 giorni
</div>


<button onclick="calcola()">
🧮 Calcola
</button>


<div id="risultato" class="risultato">
Nessun risultato
</div>


<button class="blue" onclick="creaEventi()">
📅 Crea eventi Google Calendar
</button>
<script>


// imposta automaticamente la data di oggi

document.getElementById("data").valueAsDate = new Date();



let risultatoTesto = "";



// aggiunge giorni alla data

function aggiungiGiorni(data, giorni){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + giorni);

    return nuova;

}




// formato data italiano

function formatoItaliano(data){

    return data.toLocaleDateString("it-IT");

}




// prende le prove selezionate

function getGiorni(){

    let lista=[];


    document.querySelectorAll(".giorni:checked").forEach(x=>{

        lista.push(Number(x.value));

    });


    return lista;

}





// calcolo date

function calcola(){


    let valore =
    document.getElementById("data").value;


    if(!valore){

        alert("Inserisci la data");

        return;

    }



    let data = new Date(valore);


    let campione =
    document.getElementById("campione").value;



    let giorni = getGiorni();



    risultatoTesto =
    "🧱 Rotture a compressione cubetti\n\n";



    if(campione){

        risultatoTesto +=
        "Campione: " + campione + "\n\n";

    }



    giorni.forEach(g=>{


        let nuova =
        aggiungiGiorni(data,g);



        risultatoTesto +=
        "➕ " + g + " giorni → "
        + formatoItaliano(nuova)
        + "\n";


    });



    document.getElementById("risultato").innerHTML =
    risultatoTesto.replace(/\n/g,"<br>");

}






// crea eventi Google Calendar uno alla volta

function creaEventi(){


    let valore =
    document.getElementById("data").value;


    if(!valore){

        alert("Inserisci la data");

        return;

    }



    let data = new Date(valore);



    let campione =
    document.getElementById("campione").value;



    let giorni = getGiorni();



    if(giorni.length===0){

        alert("Seleziona almeno una prova");

        return;

    }




    giorni.forEach((g,indice)=>{


        setTimeout(()=>{


            let evento =
            aggiungiGiorni(data,g);



            let anno =
            evento.getFullYear();


            let mese =
            String(evento.getMonth()+1).padStart(2,"0");


            let giorno =
            String(evento.getDate()).padStart(2,"0");



            let titolo =
            "🧱 Rottura cubetti - "
            + g
            + " giorni";



            if(campione){

                titolo +=
                " - "
                + campione;

            }




            let link =

            "https://calendar.google.com/calendar/render?action=TEMPLATE"

            + "&text="
            + encodeURIComponent(titolo)


            + "&dates="

            + anno
            + mese
            + giorno
            + "T090000/"

            + anno
            + mese
            + giorno
            + "T100000";



            window.open(link,"_blank");



        }, indice * 2000);



    });


}
</script>


</div>


</body>

</html>
