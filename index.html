<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rotture Cubetti</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

.box{
    max-width:500px;
    margin:auto;
    background:#1e293b;
    padding:20px;
    border-radius:18px;
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:0;
    margin:8px 0 15px;
    box-sizing:border-box;
}


.prova{
    background:#334155;
    padding:10px;
    border-radius:10px;
    margin:8px 0;
}


button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:17px;
}


.calendar{
    background:#2563eb;
}


.risultato{
    margin-top:20px;
    padding:15px;
    background:#334155;
    border-radius:10px;
}


.link{
    display:block;
    background:#2563eb;
    color:white;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
}


</style>

</head>


<body>


<div class="box">


<h1>🧱 Rotture a compressione cubetti</h1>


<label>Campione / Cantiere</label>

<input id="campione" placeholder="es. Cantiere Rossi">


<label>Data confezionamento</label>

<input type="date" id="data">


<h3>Seleziona prove</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
+1 giorno
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="3">
+3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="4">
+4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
+7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="14">
+14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
+28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
+60 giorni
</div>


<button onclick="calcola()">
🧮 Calcola
</button>


<div id="risultato" class="risultato">
Nessun calcolo
</div>

<script>


// imposta automaticamente la data di oggi

document.getElementById("data").valueAsDate = new Date();



// aggiunge giorni

function aggiungiGiorni(data, numero){

    let nuova = new Date(data);

    nuova.setDate(nuova.getDate() + numero);

    return nuova;

}



// formato italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}



// legge le prove selezionate

function getProve(){

    let lista=[];


    document.querySelectorAll(".giorno:checked").forEach((x)=>{

        lista.push(Number(x.value));

    });


    return lista;

}





// crea link Google Calendar

function linkGoogle(dataEvento, giorni){


    let anno =
    dataEvento.getFullYear();


    let mese =
    String(dataEvento.getMonth()+1).padStart(2,"0");


    let giorno =
    String(dataEvento.getDate()).padStart(2,"0");



    let inizio =
    anno + mese + giorno + "T090000";


    let fine =
    anno + mese + giorno + "T100000";



    let campione =
    document.getElementById("campione").value;



    let titolo =
    "🧱 Rottura cubetti - "
    + giorni
    + " giorni";



    if(campione){

        titolo +=
        " - "
        + campione;

    }



    let url =

    "https://calendar.google.com/calendar/render"
    + "?action=TEMPLATE"
    + "&text="
    + encodeURIComponent(titolo)

    + "&dates="
    + inizio
    + "%2F"
    + fine;



    return url;

}







function calcola(){


    let valore =
    document.getElementById("data").value;



    if(!valore){

        alert("Inserisci una data");

        return;

    }



    let data =
    new Date(valore);



    let prove =
    getProve();



    if(prove.length===0){

        alert("Seleziona almeno una prova");

        return;

    }



    let html =
    "🧱 Rotture a compressione cubetti<br><br>";



    prove.forEach((giorni)=>{


        let dataEvento =
        aggiungiGiorni(data,giorni);



        html +=

        "📅 <b>"
        + giorni
        + " giorni</b><br>"

        + formatoData(dataEvento)


        + "<a class='link' target='_blank' href='"

        + linkGoogle(dataEvento,giorni)

        + "'>➕ Inserisci in Google Calendar</a>";



    });



    document.getElementById("risultato").innerHTML =
    html;


}

</script>


</div>


</body>

</html>
