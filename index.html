<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDILTEST 2.0 PRO</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">


<style>


*{

box-sizing:border-box;

}



body{

margin:0;

padding:15px;

font-family:'Inter',sans-serif;

background:linear-gradient(135deg,#cbd5e1,#f8fafc);

color:#16324f;

}




.container{

max-width:540px;

margin:auto;

}




.app{

background:rgba(255,255,255,0.75);

backdrop-filter:blur(18px);

border-radius:30px;

padding:22px;

box-shadow:0 15px 40px rgba(0,0,0,0.15);

}





.titolo{

font-family:'Montserrat',sans-serif;

text-align:center;

font-size:28px;

font-weight:700;

color:#0b416b;

}





.sottotitolo{

text-align:center;

font-size:12px;

color:#64748b;

margin-bottom:20px;

}




.sezione{

font-family:'Montserrat',sans-serif;

font-size:17px;

font-weight:700;

margin-top:20px;

color:#0b416b;

}




label{

display:block;

margin-top:12px;

font-size:14px;

font-weight:600;

}




.info{

font-size:11px;

color:#64748b;

font-weight:400;

}




input{

width:100%;

height:50px;

border:0;

border-radius:15px;

padding:10px;

margin-top:5px;

background:white;

font-size:16px;

transition:0.2s;

}




input:focus{

outline:none;

transform:scale(1.02);

box-shadow:0 0 0 3px rgba(11,65,107,0.20);

}





button{

cursor:pointer;

transition:0.2s;

}



button:hover{

transform:scale(1.03);

}



button:active{

transform:scale(0.97);

}





.bottone{

width:100%;

height:55px;

margin-top:12px;

border:0;

border-radius:16px;

font-size:15px;

font-weight:700;

color:white;

}





.gps{

background:#16a34a;

}



.genera{

height:65px;

background:#0b416b;

font-size:17px;

}





.contatore{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

}




.contatore button{

width:55px;

height:50px;

border:0;

border-radius:15px;

background:#0b416b;

color:white;

font-size:28px;

}





.contatore input{

width:80px;

text-align:center;

font-size:22px;

font-weight:bold;

}





.giorni{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin-top:15px;

}




.giorno{

height:50px;

border:0;

border-radius:15px;

background:white;

color:#0b416b;

font-size:16px;

font-weight:700;

}





.giorno.attivo{

background:#0b416b;

color:white;

}





.evento{

background:white;

border-radius:18px;

padding:15px;

margin-top:15px;

box-shadow:0 5px 15px rgba(0,0,0,0.08);

}





.bottoneGoogle{

display:block;

margin-top:12px;

padding:15px;

background:#2563eb;

color:white;

border-radius:15px;

text-align:center;

text-decoration:none;

font-weight:700;

}




.bottoneWhatsApp{

display:block;

margin-top:12px;

padding:15px;

background:#16a34a;

color:white;

border-radius:15px;

text-align:center;

text-decoration:none;

font-weight:700;

}



</style>
</head>


<body>


<div class="container">


<div class="app">



<div class="titolo">

EDILTEST 2.0 PRO

</div>



<div class="sottotitolo">

Gestione prove calcestruzzo<br>

Prelievi • Rotture • Calendario • Comunicazioni

</div>




<div class="sezione">

DATI PRELIEVO

</div>




<label>

Cantiere

<span class="info">(obbligatorio)</span>

</label>


<input id="cantiere" placeholder="Nome cantiere">





<label>

Cliente

<span class="info">(opzionale)</span>

</label>


<input id="cliente" placeholder="Nome cliente">





<label>

Posizione cantiere

<span class="info">(GPS automatica o inserimento manuale)</span>

</label>


<input id="posizione" placeholder="Posizione cantiere (link o indirizzo)">



<button class="bottone gps" onclick="acquisisciPosizione()">

RILEVA POSIZIONE CANTIERE

</button>





<label>

Data prelievo

<span class="info">(automatica)</span>

</label>


<input type="date" id="data">






<label>

Numero miscele

<span class="info">(obbligatorio)</span>

</label>



<div class="contatore">



<button onclick="modificaMiscele(-1)">

−

</button>




<input id="miscele" value="1" readonly>




<button onclick="modificaMiscele(1)">

+

</button>



</div>







<label>

Numero verbale

<span class="info">(opzionale)</span>

</label>



<input id="verbale" placeholder="Numero verbale">







<div class="sezione">

PROGRAMMA ROTTURE

</div>




<div class="info">

Seleziona i giorni di prova da programmare

</div>





<div class="giorni">



<button class="giorno" onclick="selezionaGiorno(this,1)">

1

</button>



<button class="giorno" onclick="selezionaGiorno(this,2)">

2

</button>



<button class="giorno" onclick="selezionaGiorno(this,3)">

3

</button>



<button class="giorno" onclick="selezionaGiorno(this,4)">

4

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,7)">

7

</button>



<button class="giorno" onclick="selezionaGiorno(this,14)">

14

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,28)">

28

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,60)">

60

</button>



</div>







<button class="bottone genera" onclick="generaProgramma()">

GENERA PROGRAMMA ROTTURE

</button>






<div id="risultato">

</div>




</div>


</div>
<script>


let giorniSelezionati=[7,28,60];



// DATA AUTOMATICA

window.onload=function(){

let oggi=new Date();

oggi.setMinutes(oggi.getMinutes()-oggi.getTimezoneOffset());

document.getElementById("data").value=oggi.toISOString().split("T")[0];



// recupero ultimo utilizzo

let salvato=localStorage.getItem("ediltest_dati");


if(salvato){

let dati=JSON.parse(salvato);


document.getElementById("cantiere").value=dati.cantiere || "";

document.getElementById("cliente").value=dati.cliente || "";

document.getElementById("posizione").value=dati.posizione || "";

document.getElementById("miscele").value=dati.miscele || 1;

document.getElementById("verbale").value=dati.verbale || "";

}


};







function salvaDati(){


let dati={


cantiere:document.getElementById("cantiere").value,

cliente:document.getElementById("cliente").value,

posizione:document.getElementById("posizione").value,

miscele:document.getElementById("miscele").value,

verbale:document.getElementById("verbale").value


};


localStorage.setItem(

"ediltest_dati",

JSON.stringify(dati)

);


}








function modificaMiscele(valore){


let campo=document.getElementById("miscele");


let numero=parseInt(campo.value)+valore;



if(numero<1){

numero=1;

}



campo.value=numero;


salvaDati();


}









function selezionaGiorno(button,giorno){



let posizione=giorniSelezionati.indexOf(giorno);



if(posizione>=0){


giorniSelezionati.splice(posizione,1);


button.classList.remove("attivo");


}

else{


giorniSelezionati.push(giorno);


button.classList.add("attivo");


}



giorniSelezionati.sort(function(a,b){

return a-b;

});


}









function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(

nuova.getDate()+giorni

);


return nuova;


}









function formatoData(data){


return data.toLocaleDateString("it-IT");


}









function formatoGoogle(data,ora){


let anno=data.getFullYear();


let mese=String(data.getMonth()+1).padStart(2,"0");


let giorno=String(data.getDate()).padStart(2,"0");



return anno+mese+giorno+"T"+ora;


}









function acquisisciPosizione(){



if(!navigator.geolocation){


alert("Geolocalizzazione non disponibile");


return;


}




navigator.geolocation.getCurrentPosition(



function(pos){



let lat=pos.coords.latitude;


let lon=pos.coords.longitude;



let link=

"https://maps.google.com/?q="+lat+","+lon;



document.getElementById("posizione").value=link;



salvaDati();



let bottone=document.querySelector(".gps");



bottone.innerHTML="POSIZIONE ACQUISITA";



},



function(){


alert("Impossibile rilevare la posizione");


}



);



}








function creaLinkGoogle(titolo,inizio,fine,descrizione,posizione){



return(

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="+encodeURIComponent(titolo)

+

"&dates="+inizio+"%2F"+fine

+

"&details="+encodeURIComponent(descrizione)

+

(posizione ?

"&location="+encodeURIComponent(posizione)

:

"")

);


}

  function generaProgramma(){


let cantiere=document.getElementById("cantiere").value.trim();

let cliente=document.getElementById("cliente").value.trim();

let posizione=document.getElementById("posizione").value.trim();

let valoreData=document.getElementById("data").value;

let miscele=document.getElementById("miscele").value;

let verbale=document.getElementById("verbale").value || "non inserito";




if(!cantiere){

alert("Inserire il cantiere");

return;

}




if(giorniSelezionati.length===0){

alert("Selezionare almeno un giorno di rottura");

return;

}




salvaDati();





let p=valoreData.split("-");



let data=new Date(

Number(p[0]),

Number(p[1])-1,

Number(p[2])

);





let cubettiPerProva=Number(miscele)*2;


let cubettiTotali=cubettiPerProva*giorniSelezionati.length;





let messaggioWhatsApp=

"EDILTEST 2.0 PRO\n\n"+

"Cantiere: "+cantiere+"\n";




if(cliente){

messaggioWhatsApp+=

"Cliente: "+cliente+"\n";

}



messaggioWhatsApp+=

"Data prelievo: "+formatoData(data)+"\n"+

"Numero miscele: "+miscele+"\n"+

"Cubetti per prova: "+cubettiPerProva+"\n"+

"Cubetti totali: "+cubettiTotali+"\n"+

"Verbale: "+verbale+"\n\n"+

"PROGRAMMA ROTTURE\n";






let risultato="";







// REPORT GENERALE



let descrizioneReport=

"EDILTEST 2.0 PRO\n\n"+

"REPORT PRELIEVO\n\n"+

"Cantiere: "+cantiere+"\n"+

(cliente ? "Cliente: "+cliente+"\n":"")+

"Data prelievo: "+formatoData(data)+"\n"+

"Numero miscele: "+miscele+"\n"+

"Cubetti per prova: "+cubettiPerProva+"\n"+

"Cubetti totali: "+cubettiTotali+"\n"+

"Verbale: "+verbale+"\n\n"+

"PROGRAMMA ROTTURE\n";






giorniSelezionati.forEach(function(g){


let prova=aggiungiGiorni(data,g);



let testo=g===1 ? "giorno" : "giorni";



descrizioneReport+=

g+" "+testo+": "+formatoData(prova)+"\n";



messaggioWhatsApp+=

g+" "+testo+": "+formatoData(prova)+"\n";



});






let linkWhatsApp=

"https://wa.me/?text="+encodeURIComponent(messaggioWhatsApp);






let linkReport=creaLinkGoogle(

cantiere+" - Report Prelievo",

formatoGoogle(data,"080000"),

formatoGoogle(data,"170000"),

descrizioneReport,

posizione

);







risultato+=`

<div class="evento">


<div class="titoloEvento">

REPORT PRELIEVO

</div>


<div>

${cantiere}<br>

${formatoData(data)}

</div>



<a class="bottoneGoogle"

href="${linkReport}"

target="_blank">

INSERISCI IN GOOGLE CALENDAR

</a>



<a class="bottoneWhatsApp"

href="${linkWhatsApp}"

target="_blank">

INVIA PROGRAMMA WHATSAPP

</a>


</div>

`;







// EVENTI ROTTURE SINGOLI



giorniSelezionati.forEach(function(giorno){



let dataRottura=aggiungiGiorni(data,giorno);



let descrizione=

"EDILTEST 2.0 PRO\n\n"+

"PROVA COMPRESSIONE\n\n"+

"Cantiere: "+cantiere+"\n"+

(cliente ? "Cliente: "+cliente+"\n":"")+

"Data prelievo: "+formatoData(data)+"\n"+

"Numero miscele: "+miscele+"\n"+

"Cubetti da rompere: "+cubettiPerProva+"\n"+

"Verbale: "+verbale+"\n"+

"Età provino: "+giorno+" "+

(giorno===1 ? "giorno":"giorni");






let titolo=

cantiere+

" - Rottura "+

giorno+" "+

(giorno===1 ? "giorno":"giorni");






let link=creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione,

posizione

);





risultato+=`

<div class="evento">


<div class="titoloEvento">

ROTTURA ${giorno} ${giorno===1 ? "GIORNO":"GIORNI"}

</div>


<div>

${formatoData(dataRottura)}

</div>



<a class="bottoneGoogle"

href="${link}"

target="_blank">

INSERISCI IN GOOGLE CALENDAR

</a>



</div>

`;



});







document.getElementById("risultato").innerHTML=risultato;



}
  function resetDati(){


if(confirm("Cancellare tutti i dati inseriti?")){


document.getElementById("cantiere").value="";

document.getElementById("cliente").value="";

document.getElementById("posizione").value="";

document.getElementById("miscele").value=1;

document.getElementById("verbale").value="";


localStorage.removeItem("ediltest_dati");


document.getElementById("risultato").innerHTML="";


}



}






</script>





<button 
class="bottone"
style="background:#64748b;margin-top:15px;"
onclick="resetDati()">

NUOVO PRELIEVO / RESET

</button>





</body>

</html>
