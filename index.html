<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestione Prove Calcestruzzo</title>

<style>

body{
font-family:Arial,sans-serif;
background:#5b5b5b;
padding:20px;
margin:0;
color:white;
}

.container{
max-width:560px;
margin:auto;
background:#292929;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px #222;
}

h1{
text-align:center;
color:#f59e0b;
}

label{
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin:8px 0 15px;
border-radius:8px;
border:0;
box-sizing:border-box;
font-size:16px;
}

.prova{
background:#3f3f3f;
padding:12px;
border-radius:8px;
margin:8px 0;
}

.prova input{
width:auto;
}

button{
width:100%;
padding:13px;
margin-top:15px;
border:0;
border-radius:10px;
background:#d97706;
color:white;
font-size:16px;
cursor:pointer;
}

.reset{
background:#dc2626;
}

.risultato{
margin-top:20px;
background:#111;
padding:15px;
border-radius:10px;
}

.link{
display:block;
background:#2563eb;
color:white;
padding:12px;
margin-top:10px;
border-radius:8px;
text-align:center;
text-decoration:none;
}

.fatto{
background:#16a34a !important;
}

.dataGrande{
font-size:34px;
font-weight:bold;
color:#f59e0b;
margin:10px 0;
}

.info{
font-size:18px;
line-height:1.5;
}

hr{
border:0;
border-top:1px solid #555;
margin:20px 0;
}

</style>

</head>


<body>


<div class="container">


<h1>
Gestione Prove Calcestruzzo
</h1>


<label>Nome impianto</label>

<input id="impianto" placeholder="Nome impianto">


<label>Cliente / Cantiere</label>

<input id="cliente" placeholder="Cliente o cantiere">


<label>Classe calcestruzzo</label>

<input id="classe" placeholder="Es. C25/30">


<label>Numero verbale prelievo</label>

<input id="verbale" placeholder="Numero verbale">


<label>Data prelievo</label>

<input type="date" id="data">


<label>Numero prelievi</label>

<input 
type="number"
id="prelievi"
value="1"
min="1">


<h3>
Seleziona rotture
</h3>


<div class="prova">
<input type="checkbox" class="giorno" value="1">
Rottura a 1 giorno
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="3">
Rottura a 3 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="4">
Rottura a 4 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="7" checked>
Rottura a 7 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="14">
Rottura a 14 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="28" checked>
Rottura a 28 giorni
</div>


<div class="prova">
<input type="checkbox" class="giorno" value="60" checked>
Rottura a 60 giorni
</div>


<button onclick="genera()">
Genera calendario
</button>


<button class="reset" onclick="resetStato()">
Reset importazioni
</button>


<button onclick="nuovoPrelievo()">
Nuovo prelievo
</button>


<div id="risultato" class="risultato">

Nessun evento creato

</div>


<script>


if(localStorage.getItem("ultima_data")){

caricaDati();

}
else{

document.getElementById("data").valueAsDate=new Date();

}


function aggiungiGiorni(data,giorni){

let nuova=new Date(data);

nuova.setDate(
nuova.getDate()+giorni
);

return nuova;

}


function formatoData(data){

return data.toLocaleDateString("it-IT");

}


function getProve(){

let lista=[];

document.querySelectorAll(".giorno:checked")
.forEach(function(x){

lista.push(Number(x.value));

});

return lista.sort((a,b)=>a-b);

}


function formatoGoogle(data,ora){

let anno=data.getFullYear();

let mese=String(data.getMonth()+1)
.padStart(2,"0");

let giorno=String(data.getDate())
.padStart(2,"0");

return anno+mese+giorno+"T"+ora;

}
    
function creaLinkGoogle(titolo,inizio,fine,descrizione){

return(

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="

+

encodeURIComponent(titolo)

+

"&dates="

+

inizio

+

"%2F"

+

fine

+

"&details="

+

encodeURIComponent(descrizione)

);

}



function eventoImportato(id){

return localStorage.getItem(id)==="si";

}



function segnaImportato(id,bottone){

localStorage.setItem(id,"si");

bottone.innerHTML="✓ Inserito nel calendario";

bottone.classList.add("fatto");

}



function creaBottone(link,id,testo){

let classe=

eventoImportato(id)

?

"link fatto"

:

"link";


let scritta=

eventoImportato(id)

?

"✓ Inserito nel calendario"

:

testo;


return `

<a

class="${classe}"

target="_blank"

rel="noopener noreferrer"

href="${link}"

onclick="segnaImportato('${id}',this)">

${scritta}

</a>

`;

}





function salvaDati(){


localStorage.setItem(
"ultimo_impianto",
document.getElementById("impianto").value
);


localStorage.setItem(
"ultimo_cliente",
document.getElementById("cliente").value
);


localStorage.setItem(
"ultima_classe",
document.getElementById("classe").value
);


localStorage.setItem(
"ultimo_verbale",
document.getElementById("verbale").value
);


localStorage.setItem(
"ultima_data",
document.getElementById("data").value
);


localStorage.setItem(
"ultimi_prelievi",
document.getElementById("prelievi").value
);


}



function caricaDati(){


document.getElementById("impianto").value=

localStorage.getItem("ultimo_impianto") || "";



document.getElementById("cliente").value=

localStorage.getItem("ultimo_cliente") || "";



document.getElementById("classe").value=

localStorage.getItem("ultima_classe") || "";



document.getElementById("verbale").value=

localStorage.getItem("ultimo_verbale") || "";



document.getElementById("data").value=

localStorage.getItem("ultima_data") || "";



document.getElementById("prelievi").value=

localStorage.getItem("ultimi_prelievi") || "1";


}






function genera(){


let impianto=

document.getElementById("impianto")
.value
.trim();



let cliente=

document.getElementById("cliente")
.value
.trim();



let classe=

document.getElementById("classe")
.value
.trim();



let verbale=

document.getElementById("verbale")
.value
.trim();



let valoreData=

document.getElementById("data")
.value;



let prelievi=

Number(
document.getElementById("prelievi").value
);



let cubi=

prelievi*6;



if(!impianto || !valoreData){

alert("Inserire impianto e data prelievo");

return;

}



let parti=

valoreData.split("-");



let dataPrelievo=

new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);



let prove=

getProve();



if(prove.length===0){

alert("Selezionare almeno una rottura");

return;

}



let html="";



let dataTesto=

formatoData(dataPrelievo);




let titoloReport=

"REPORT Calcestruzzo - "

+

impianto;



let descrizioneReport=

"REPORT PRELIEVO CALCESTRUZZO\n\n"

+

"Impianto: "

+

impianto

+

"\nCliente/Cantiere: "

+

cliente

+

"\nClasse calcestruzzo: "

+

classe

+

"\nNumero verbale: "

+

verbale

+

"\n\nData prelievo: "

+

dataTesto

+

"\nNumero prelievi: "

+

prelievi

+

"\nTotale cubi confezionati: "

+

cubi

+

"\n\nRotture programmate:\n";



prove.forEach(function(giorni){


let data=

aggiungiGiorni(
dataPrelievo,
giorni
);



descrizioneReport+=

"• "

+

giorni

+

" giorni → "

+

formatoData(data)

+

"\n";


});



descrizioneReport+=

"\nNote:\n________________________";

let linkReport=

creaLinkGoogle(

titoloReport,

formatoGoogle(dataPrelievo,"080000"),

formatoGoogle(dataPrelievo,"170000"),

descrizioneReport

);



let idReport=

"report_"

+

impianto

+

"_"

+

valoreData;



html+=`

<b style="font-size:22px;color:#f59e0b">

REPORT CALCESTRUZZO

</b>


<div class="dataGrande">

${dataTesto}

</div>


<div class="info">

Impianto:

<b>${impianto}</b>

<br>

Cliente:

<b>${cliente}</b>

<br>

Classe:

<b>${classe}</b>

<br>

Verbale:

<b>${verbale}</b>

<br>

Prelievi:

<b>${prelievi}</b>

<br>

Totale cubi:

<b>${cubi}</b>

</div>

`;



html+=creaBottone(

linkReport,

idReport,

"Importa REPORT nel Calendario Google"

);






prove.forEach(function(giorni){



let dataRottura=

aggiungiGiorni(

dataPrelievo,

giorni

);



let dataRotturaTesto=

formatoData(dataRottura);




let titolo=

"Rottura "

+

giorni

+

" giorni - "

+

impianto

+

" ("

+

cubi

+

" cubi)";




let descrizione=

"PROVA DI COMPRESSIONE\n\n"

+

"Impianto: "

+

impianto

+

"\nCliente/Cantiere: "

+

cliente

+

"\nClasse calcestruzzo: "

+

classe

+

"\nNumero verbale: "

+

verbale

+

"\n\nData prelievo: "

+

dataTesto

+

"\nData rottura: "

+

dataRotturaTesto

+

"\nEtà provini: "

+

giorni

+

" giorni"

+

"\n\nNumero prelievi: "

+

prelievi

+

"\nCubi da rompere: "

+

cubi

+

"\n\nOperazione prevista:"

+

"\nEseguire la prova di compressione dei provini.";




let link=

creaLinkGoogle(

titolo,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);



let id=

"rottura_"

+

impianto

+

"_"

+

valoreData

+

"_"

+

giorni;





html+=`

<hr>


<b style="font-size:22px">

Rottura a ${giorni} giorni

</b>


<div class="dataGrande">

${dataRotturaTesto}

</div>


<div class="info">

${cubi} cubi

(${prelievi} prelievi)

</div>


`;



html+=creaBottone(

link,

id,

"Importa nel Calendario Google"

);



});



document.getElementById("risultato").innerHTML=html;



salvaDati();



}



function resetStato(){


if(confirm("Cancellare lo stato delle importazioni?")){


Object.keys(localStorage).forEach(function(key){


if(

key.startsWith("report_")

||

key.startsWith("rottura_")

){


localStorage.removeItem(key);


}


});


alert("Stato importazioni azzerato");


genera();


}


}






function nuovoPrelievo(){


if(confirm("Creare un nuovo prelievo?")){


document.getElementById("impianto").value="";


document.getElementById("cliente").value="";


document.getElementById("classe").value="";


document.getElementById("verbale").value="";


document.getElementById("prelievi").value="1";


document.getElementById("data").valueAsDate=new Date();



document.getElementById("risultato").innerHTML=

"Nessun evento creato";


}


}



</script>


</div>


</body>


</html>
