<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestione Prove Calcestruzzo</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#5b5b5b;
    margin:0;
    padding:20px;
    color:white;
}


.container{

    max-width:520px;
    margin:auto;
    background:#292929;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px #222;

}


h1{

    text-align:center;
    color:#f59e0b;

}



label{

    font-weight:bold;

}



input{

    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    border-radius:8px;
    border:0;
    font-size:16px;
    box-sizing:border-box;

}



.box-prova{

    background:#3f3f3f;
    padding:10px;
    margin:8px 0;
    border-radius:8px;

}



button{

    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#d97706;
    color:white;
    font-size:17px;
    cursor:pointer;

}



.risultato{

    margin-top:20px;
    background:#111;
    padding:15px;
    border-radius:10px;

}



.link{

    display:block;
    background:#2563eb;
    color:white;
    padding:12px;
    text-align:center;
    border-radius:8px;
    margin-top:10px;
    text-decoration:none;

}



</style>


</head>


<body>


<div class="container">


<h1>Gestione Prove Calcestruzzo</h1>


<label>Nome impianto</label>

<input id="impianto" placeholder="Inserire nome impianto">


<label>Data prelievo</label>

<input type="date" id="data">



<h3>Prove compressione cubetti</h3>



<div class="box-prova">
<input type="checkbox" class="giorno" value="1">
1 giorno
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="3">
3 giorni
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="4">
4 giorni
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="7" checked>
7 giorni
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="14">
14 giorni
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="28" checked>
28 giorni
</div>


<div class="box-prova">
<input type="checkbox" class="giorno" value="60" checked>
60 giorni
</div>


<button onclick="generaEventi()">

Genera calendario

</button>


<div id="risultato" class="risultato">

Nessun evento creato

</div>

<script>


// imposta automaticamente la data odierna

document.getElementById("data").valueAsDate = new Date();




// aggiunge giorni

function aggiungiGiorni(data, giorni){

    let nuovaData = new Date(data);

    nuovaData.setDate(nuovaData.getDate() + giorni);

    return nuovaData;

}




// formato data italiano

function formatoData(data){

    return data.toLocaleDateString("it-IT");

}




// legge prove selezionate

function getProve(){

    let prove = [];


    document.querySelectorAll(".giorno:checked").forEach(function(c){

        prove.push(Number(c.value));

    });


    return prove;

}






// crea link Google Calendar

function creaEventoGoogle(titolo, inizio, fine, descrizione){



    let url =

    "https://calendar.google.com/calendar/render"

    + "?action=TEMPLATE"

    + "&text="

    + encodeURIComponent(titolo)

    + "&dates="

    + inizio

    + "%2F"

    + fine

    + "&details="

    + encodeURIComponent(descrizione);



    return url;

}






// converte data e orari per Google Calendar

function formatoGoogle(data, ora){


    let anno =
    data.getFullYear();


    let mese =
    String(data.getMonth()+1).padStart(2,"0");


    let giorno =
    String(data.getDate()).padStart(2,"0");



    return anno + mese + giorno + "T" + ora;

}






function generaEventi(){


    let valoreData =
    document.getElementById("data").value;



    if(!valoreData){

        alert("Inserire la data del prelievo");

        return;

    }




    let impianto =
    document.getElementById("impianto").value;



    if(!impianto){

        alert("Inserire il nome dell'impianto");

        return;

    }



    let dataPrelievo =
    new Date(valoreData);



    let prove =
    getProve();



    if(prove.length === 0){

        alert("Selezionare almeno una prova");

        return;

    }




    let html = "";



    let dataTesto =
    formatoData(dataPrelievo);




    // EVENTO REPORT

    let titoloReport =

    "Report calcestruzzo - "
    +
    impianto;



    let descrizioneReport =

    "Impianto: "
    +
    impianto
    +
    "\n"
    +
    "Data prelievo: "
    +
    dataTesto;



    let linkReport =

    creaEventoGoogle(

        titoloReport,

        formatoGoogle(dataPrelievo,"080000"),

        formatoGoogle(dataPrelievo,"170000"),

        descrizioneReport

    );



    html +=

    "<b>Report calcestruzzo</b><br>"
    +
    dataTesto
    +
    "<a class='link' target='_blank' href='"
    +
    linkReport
    +
    "'>Apri evento report</a>";

    

    // EVENTI ROTTURE CUBETTI


    prove.forEach(function(giorni){


        let dataRottura =

        aggiungiGiorni(

            dataPrelievo,

            giorni

        );



        let titoloRottura =


        "Rottura cubetti "
        +
        giorni
        +
        " giorni - Prelievo "
        +
        dataTesto
        +
        " - "
        +
        impianto;




        let descrizioneRottura =


        "Prova compressione cubetti\n"
        +
        "Impianto: "
        +
        impianto
        +
        "\n"
        +
        "Data prelievo: "
        +
        dataTesto
        +
        "\n"
        +
        "Età provino: "
        +
        giorni
        +
        " giorni";




        let linkRottura =


        creaEventoGoogle(

            titoloRottura,

            formatoGoogle(dataRottura,"090000"),

            formatoGoogle(dataRottura,"100000"),

            descrizioneRottura

        );




        html +=


        "<br><br><b>Rottura "
        +
        giorni
        +
        " giorni</b><br>"
        +
        formatoData(dataRottura)

        +

        "<a class='link' target='_blank' href='"

        +

        linkRottura

        +

        "'>Apri evento rottura</a>";



    });





    document.getElementById("risultato").innerHTML = html;



}



    
</script>


</div>


</body>

</html>
