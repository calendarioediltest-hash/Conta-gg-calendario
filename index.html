<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDILTEST 2.0</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

padding:15px;

font-family:Arial,sans-serif;

background:
linear-gradient(135deg,#cbd5e1,#eef2f7);

color:#12324a;

}



.container{

max-width:520px;

margin:auto;

}



.app{

background:

linear-gradient(

145deg,

rgba(255,255,255,0.85),

rgba(220,230,240,0.65)

);

backdrop-filter:blur(18px);

border-radius:35px;

padding:22px;

box-shadow:

0 20px 50px rgba(0,0,0,0.15);

}



.logo{

text-align:center;

font-size:18px;

font-weight:bold;

color:#0b416b;

margin-bottom:5px;

}



.titoloApp{

text-align:center;

font-size:28px;

font-weight:bold;

color:#0b416b;

}



.sottotitolo{

text-align:center;

font-size:13px;

color:#64748b;

margin-bottom:25px;

}



.sezione{

font-size:20px;

font-weight:bold;

color:#0b416b;

margin-top:15px;

margin-bottom:10px;

}



label{

display:block;

font-weight:bold;

margin-top:14px;

font-size:16px;

}



.opzionale{

font-size:12px;

color:#64748b;

font-weight:normal;

}



input{

width:100%;

height:55px;

border:0;

border-radius:16px;

margin-top:6px;

padding:12px;

font-size:18px;

background:rgba(255,255,255,0.9);

box-shadow:

inset 0 2px 8px rgba(0,0,0,0.08);

}



.contatore{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-top:10px;

}



.contatore button{

width:65px;

height:55px;

border:0;

border-radius:18px;

background:#0b416b;

color:white;

font-size:30px;

}



.contatore input{

width:90px;

text-align:center;

font-weight:bold;

font-size:24px;

}



</style>


</head>


<body>


<div class="container">


<div class="app">


<div class="logo">

LOGO EDILTEST

</div>


<div class="titoloApp">

EDILTEST 2.0

</div>


<div class="sottotitolo">

Gestione prove calcestruzzo<br>

Prelievi • Rotture • Calendario

</div>



<div class="sezione">

DATI PRELIEVO

</div>



<label>

Impianto

<span class="opzionale">

(obbligatorio)

</span>

</label>


<input id="impianto" placeholder="Nome impianto">



<label>

Data prelievo

<span class="opzionale">

(obbligatorio)

</span>

</label>


<input type="date" id="data">



<label>

Numero miscele

<span class="opzionale">

(obbligatorio)

</span>

</label>


<div class="contatore">


<button onclick="modificaMiscele(-1)">

−

</button>


<input id="miscele" value="1" readonly>


<button onclick="modificaMiscele(1)">

+

</button>


</div>



<label>

Numero verbale

<span class="opzionale">

(opzionale)

</span>

</label>


<input id="verbale" placeholder="Numero verbale">


  
<style>


.giorni{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:10px;

margin-top:15px;

}



.giorno{

height:55px;

border-radius:18px;

border:0;

background:rgba(255,255,255,0.8);

font-size:17px;

font-weight:bold;

color:#0b416b;

box-shadow:

0 5px 12px rgba(0,0,0,0.08);

}



.giorno.attivo{

background:#0b416b;

color:white;

transform:scale(1.04);

}



.programma{

margin-top:20px;

background:rgba(255,255,255,0.55);

border-radius:20px;

padding:15px;

}



.rigaProgramma{

padding:10px 0;

border-bottom:1px solid rgba(0,0,0,0.08);

font-size:18px;

font-weight:bold;

}



.pulsante{

width:100%;

height:70px;

margin-top:20px;

border:0;

border-radius:22px;

background:#0b416b;

color:white;

font-size:21px;

font-weight:bold;

box-shadow:

0 10px 25px rgba(11,65,107,0.35);

}



.piccolaNota{

text-align:center;

font-size:12px;

color:#64748b;

margin-top:10px;

}


</style>




<div class="sezione">

PROGRAMMA ROTTURE

</div>



<div class="piccolaNota">

Seleziona le prove da programmare

</div>



<div class="giorni">



<button class="giorno" onclick="selezionaGiorno(this,1)">

1

</button>



<button class="giorno" onclick="selezionaGiorno(this,2)">

2

</button>



<button class="giorno" onclick="selezionaGiorno(this,3)">

3

</button>



<button class="giorno" onclick="selezionaGiorno(this,4)">

4

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,7)">

7

</button>



<button class="giorno" onclick="selezionaGiorno(this,14)">

14

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,28)">

28

</button>



<button class="giorno attivo" onclick="selezionaGiorno(this,60)">

60

</button>



</div>



<div class="programma">


<div class="sezione">

PROGRAMMA CALCOLATO

</div>


<div id="calcolo">

Inserire data prelievo

</div>



</div>



<button class="pulsante" onclick="calcolaProgramma()">

CALCOLA PROGRAMMA ROTTURE

</button>



<div class="piccolaNota">

Calcola le date e prepara gli eventi nel calendario Google

</div>



</div>

</div>

<script>


document.getElementById("data").valueAsDate=new Date();



let giorniSelezionati=[7,28,60];





function modificaMiscele(valore){


let campo=document.getElementById("miscele");


let numero=parseInt(campo.value)+valore;


if(numero<1){

numero=1;

}


campo.value=numero;


}





function selezionaGiorno(pulsante,giorno){


let posizione=giorniSelezionati.indexOf(giorno);



if(posizione>=0){


giorniSelezionati.splice(posizione,1);


pulsante.classList.remove("attivo");


}

else{


giorniSelezionati.push(giorno);


pulsante.classList.add("attivo");


}



giorniSelezionati.sort(function(a,b){

return a-b;

});


}






function aggiungiGiorni(data,giorni){


let nuova=new Date(data);


nuova.setDate(

nuova.getDate()+giorni

);


return nuova;


}





function dataIt(data){


return data.toLocaleDateString("it-IT");


}





function formatoGoogle(data,ora){


let anno=data.getFullYear();

let mese=String(data.getMonth()+1).padStart(2,"0");

let giorno=String(data.getDate()).padStart(2,"0");


return anno+mese+giorno+"T"+ora;


}





function creaLinkCalendar(titolo,inizio,fine,descrizione){


return (

"https://calendar.google.com/calendar/render"

+

"?action=TEMPLATE"

+

"&text="

+

encodeURIComponent(titolo)

+

"&dates="

+

inizio

+

"%2F"

+

fine

+

"&details="

+

encodeURIComponent(descrizione)

);


}







function calcolaProgramma(){


let dataValore=document.getElementById("data").value;


if(!dataValore){

alert("Inserire la data del prelievo");

return;

}



let parti=dataValore.split("-");


let data=new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);



let testo="";



giorniSelezionati.forEach(function(giorno){


let risultato=aggiungiGiorni(data,giorno);



testo+=`

<div class="rigaProgramma">

${giorno} giorni → ${dataIt(risultato)}

</div>

`;


});



document.getElementById("calcolo").innerHTML=testo;



creaEventi();



}








function creaEventi(){



let impianto=document.getElementById("impianto").value.trim();


let dataValore=document.getElementById("data").value;


let miscele=document.getElementById("miscele").value;


let verbale=document.getElementById("verbale").value.trim();



if(!impianto || !dataValore){

alert("Inserire impianto e data");

return;

}





let parti=dataValore.split("-");


let data=new Date(

Number(parti[0]),

Number(parti[1])-1,

Number(parti[2])

);



let cubetti=Number(miscele)*2;





let report=`

EDILTEST 2.0

REPORT PRELIEVO


Impianto: ${impianto}

Data prelievo: ${dataIt(data)}

Numero miscele: ${miscele}

Cubetti totali: ${cubetti}

Verbale: ${verbale || "non inserito"}


Programma rotture:

`;





giorniSelezionati.forEach(function(g){

report+=g+" giorni\n";

});





let linkReport=creaLinkCalendar(

"REPORT PRELIEVO - "+impianto,

formatoGoogle(data,"080000"),

formatoGoogle(data,"170000"),

report

);





let html=`


<div class="programma">


<div class="sezione">

EVENTI PRONTI

</div>


<a class="pulsante" 

style="display:block;text-align:center;text-decoration:none;padding-top:22px"

href="${linkReport}"

target="_blank">

TOCCA PER INSERIRE REPORT PRELIEVO

</a>


`;






giorniSelezionati.forEach(function(giorno){



let dataRottura=aggiungiGiorni(data,giorno);



let descrizione=

`

EDILTEST 2.0

PROVA COMPRESSIONE


Impianto: ${impianto}

Data prelievo: ${dataIt(data)}

Numero miscele: ${miscele}

Cubetti da rompere: ${cubetti}

Verbale: ${verbale || "non inserito"}

Età provino: ${giorno} giorni

`;





let link=creaLinkCalendar(

"ROTTURA "+giorno+" GIORNI - "+cubetti+" CUBI - "+impianto,

formatoGoogle(dataRottura,"090000"),

formatoGoogle(dataRottura,"100000"),

descrizione

);





html+=`

<a class="pulsante"

style="display:block;text-align:center;text-decoration:none;padding-top:22px;background:#2563eb"

href="${link}"

target="_blank">


TOCCA PER INSERIRE ROTTURA ${giorno} GIORNI


</a>

`;



});





html+=`

</div>

`;



document.getElementById("calcolo").innerHTML+=html;



}



</script>


</body>

</html>
